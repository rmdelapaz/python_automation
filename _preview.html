<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>hero preview</title>
<style>
body{margin:0;font-family:system-ui,sans-serif}
.cell{padding:16px}
.light{background:#fff;color:#111}
.dark{background:#1e1e1e;color:#eee}
img{width:720px;max-width:100%;display:block;border:1px dashed #888}
h2{font-size:14px;margin:0 0 8px}
#report{padding:16px;font-family:monospace;font-size:13px;white-space:pre-wrap}
</style></head>
<body>
<div class="cell light"><h2>LIGHT</h2><img id="s1" src="images/components/css-selectors-match.svg"></div>
<div class="cell dark"><h2>DARK (forced via container only — SVG uses prefers-color-scheme)</h2><img id="s2" src="images/components/css-selectors-match.svg"></div>
<div id="report">running…</div>
<script>
const SVGS=["images/components/css-selectors-match.svg"];
async function run(){
  let out=[];
  for(const url of SVGS){
    const r=await fetch(url); const txt=await r.text();
    const doc=new DOMParser().parseFromString(txt,"image/svg+xml");
    const err=doc.querySelector("parsererror");
    out.push("HEAD "+url+": "+r.status+(err?"  PARSEERROR":"  parse-ok"));
    // getBBox fit check: inject offscreen
    const svg=doc.documentElement;
    svg.style.position="absolute";svg.style.left="-99999px";
    document.body.appendChild(svg);
    const vb=svg.getAttribute("viewBox").split(/\s+/).map(Number);
    const W=vb[2];
    let over=[];
    svg.querySelectorAll("text,rect,line,path,circle").forEach(el=>{
      // skip transformed elements (rotations) — false positives
      if(el.getAttribute("transform")) return;
      let b; try{b=el.getBBox();}catch(e){return;}
      if(b.x+b.width>W+0.5){
        const tag=el.tagName; const t=(el.textContent||"").slice(0,40);
        over.push(tag+" right="+(b.x+b.width).toFixed(1)+" ["+t+"]");
      }
    });
    out.push(over.length? ("  FIT OVERFLOW ("+over.length+"):\n    "+over.join("\n    ")) : "  FIT OK (nothing exceeds "+W+")");
    svg.remove();
  }
  document.getElementById("report").textContent=out.join("\n");
  document.getElementById("report").dataset.done="1";
}
run();
</script>
</body></html>
