<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="pi-title pi-desc" preserveAspectRatio="xMidYMid meet">
  <title id="pi-title">A scraping pipeline needs quality gates and idempotent loads so re-runs are safe</title>
  <desc id="pi-desc">Scraped data is messy, so a pipeline is a series of gates that turn raw records into curated ones. Raw records arrive, some valid and some malformed. A validate gate checks each against a schema: valid rows continue, while bad rows are routed to a quarantine or dead-letter store to be fixed later, never dropped silently. Next a dedup step collapses records sharing a natural key so the same item isn't counted twice. Then transform normalizes formats. Finally the load is an upsert keyed by the natural key, an insert-or-update, so loading is idempotent: re-scraping the same page changes nothing or updates in place instead of creating duplicates. Two panels reinforce the ideas: keep raw, clean, and curated as separate layers, and make loads idempotent and incremental so a re-run is always safe.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .raw{fill:#f1f5f9;stroke:#64748b;stroke-width:1.4}
    .val{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.4}
    .quar{fill:#fef2f2;stroke:#ef4444;stroke-width:1.3}
    .step{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.3}
    .load{fill:#ecfdf5;stroke:#10b981;stroke-width:1.4}
    .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
    .edge{stroke:#64748b;stroke-width:1.8;fill:none}
    .redge{stroke:#ef4444;stroke-width:1.5;fill:none;stroke-dasharray:4 3}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .raw{fill:#26262a;stroke:#9ca3af}.val{fill:#3a2e0a;stroke:#fbbf24}.quar{fill:#3a1a1a;stroke:#f87171}
      .step{fill:#1e293b;stroke:#569cd6}.load{fill:#064e3b;stroke:#34d399}.panel{fill:#26262a;stroke:#3f3f46}
      .edge{stroke:#9ca3af}.redge{stroke:#f87171}
    }
  </style>
  <defs>
    <marker id="pi-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
    <marker id="pi-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="410"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="408.5" rx="10"/>
  <text class="label ink h" x="24" y="30">Scraped data is messy &#8212; gate it, dedup it, and load it so re-runs are safe</text>

  <!-- raw -->
  <rect class="raw" x="24" y="60" width="150" height="86" rx="8"/>
  <text class="label ink s" x="34" y="78" font-weight="700">Raw records</text>
  <text class="label mono green" x="34" y="96" font-size="9">{id:7, price:9.99}</text>
  <text class="label mono green" x="34" y="110" font-size="9">{id:7, price:9.99}</text>
  <text class="label mono red" x="34" y="124" font-size="9">{id:9, price:"N/A"}</text>
  <text class="label muted s" x="34" y="140" font-size="9">dupes + a bad row</text>

  <!-- validate gate -->
  <path class="edge" d="M174,103 L200,103" marker-end="url(#pi-a)"/>
  <rect class="val" x="202" y="60" width="128" height="86" rx="8"/>
  <text class="label amber s" x="266" y="80" text-anchor="middle" font-weight="700">Validate</text>
  <text class="label muted s" x="266" y="98" text-anchor="middle" font-size="9.5">schema + types</text>
  <text class="label muted s" x="266" y="112" text-anchor="middle" font-size="9.5">good rows pass;</text>
  <text class="label muted s" x="266" y="126" text-anchor="middle" font-size="9.5">bad rows fork out</text>

  <!-- quarantine -->
  <path class="redge" d="M266,146 L266,168" marker-end="url(#pi-r)"/>
  <rect class="quar" x="202" y="170" width="128" height="40" rx="7"/>
  <text class="label red s" x="266" y="188" text-anchor="middle" font-weight="700">Quarantine</text>
  <text class="label muted s" x="266" y="202" text-anchor="middle" font-size="9">fix later, never drop silently</text>

  <!-- dedup -->
  <path class="edge" d="M330,103 L356,103" marker-end="url(#pi-a)"/>
  <rect class="step" x="358" y="60" width="118" height="86" rx="8"/>
  <text class="label blue s" x="417" y="80" text-anchor="middle" font-weight="700">Dedup</text>
  <text class="label muted s" x="417" y="98" text-anchor="middle" font-size="9.5">by natural key</text>
  <text class="label mono ink" x="417" y="116" text-anchor="middle" font-size="9">two id:7 &#8594; one</text>
  <text class="label muted s" x="417" y="132" text-anchor="middle" font-size="9">count each item once</text>

  <!-- transform -->
  <path class="edge" d="M476,103 L502,103" marker-end="url(#pi-a)"/>
  <rect class="step" x="504" y="60" width="82" height="86" rx="8"/>
  <text class="label blue s" x="545" y="80" text-anchor="middle" font-weight="700">Transform</text>
  <text class="label muted s" x="545" y="98" text-anchor="middle" font-size="9">normalize</text>
  <text class="label muted s" x="545" y="112" text-anchor="middle" font-size="9">types,</text>
  <text class="label muted s" x="545" y="126" text-anchor="middle" font-size="9">units, text</text>

  <!-- load -->
  <path class="edge" d="M586,103 L610,103" marker-end="url(#pi-a)"/>
  <rect class="load" x="612" y="60" width="84" height="86" rx="8"/>
  <text class="label green s" x="654" y="80" text-anchor="middle" font-weight="700">Upsert</text>
  <text class="label muted s" x="654" y="98" text-anchor="middle" font-size="9">insert or</text>
  <text class="label muted s" x="654" y="112" text-anchor="middle" font-size="9">update</text>
  <text class="label muted s" x="654" y="126" text-anchor="middle" font-size="9">by key</text>

  <!-- panels -->
  <rect class="panel" x="24" y="228" width="330" height="66" rx="7"/>
  <text class="label blue s" x="36" y="247" font-weight="700">Separate the layers</text>
  <text class="label muted s" x="36" y="265" font-size="10.5"><tspan class="ink" font-weight="700">raw</tspan> (as-scraped, immutable) &#8594; <tspan class="ink" font-weight="700">clean</tspan> (validated,</text>
  <text class="label muted s" x="36" y="281" font-size="10.5">deduped) &#8594; <tspan class="ink" font-weight="700">curated</tspan> (ready to use). Keep raw so</text>
  <text class="label muted s" x="36" y="292" font-size="9.5">you can re-process without re-scraping.</text>

  <rect class="panel" x="366" y="228" width="330" height="66" rx="7"/>
  <text class="label green s" x="378" y="247" font-weight="700">Idempotent &amp; incremental</text>
  <text class="label muted s" x="378" y="265" font-size="10.5">Because the load upserts <tspan class="ink" font-weight="700">by key</tspan>, running the</text>
  <text class="label muted s" x="378" y="281" font-size="10.5">pipeline twice changes nothing the second time &#8212;</text>
  <text class="label muted s" x="378" y="292" font-size="9.5">re-scraping is safe; no double-counting.</text>

  <line class="frame" x1="24" y1="312" x2="696" y2="312" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="334">The difference between a script and a <tspan class="ink" font-weight="700">pipeline</tspan> is discipline at the seams: validate before anything downstream</text>
  <text class="label muted s" x="24" y="352">trusts the data, quarantine bad rows instead of letting one <tspan class="mono ink">"N/A"</tspan> crash a later stage, dedup on a stable key, and</text>
  <text class="label muted s" x="24" y="370">make the final load idempotent so a crashed run can simply be re-run &#8212; the foundation of a scraper you can trust daily.</text>
</svg>
