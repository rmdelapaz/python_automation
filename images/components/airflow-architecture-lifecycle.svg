<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="af-title af-desc" preserveAspectRatio="xMidYMid meet">
  <title id="af-title">How a DAG file becomes scheduled runs of task instances in Airflow</title>
  <desc id="af-desc">The Airflow lifecycle and architecture. A DAG file written in Python is parsed by the Scheduler, which on each schedule interval creates a DAG Run whose tasks become task instances. The Executor and its workers run each task instance, moving it through states queued, running, then success, failed or up for retry. A central Metadata database records the state of every run and task; the Scheduler and Executor read and write it. The Web Server reads that database to show the UI. The takeaway is that a DAG is a directed acyclic graph on a schedule, and Airflow turns the file into runs, runs into task instances, and tracks all of it in the metadata database.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .dagfile{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.3}
    .sched{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.3}
    .run{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.3}
    .exec{fill:#ecfdf5;stroke:#10b981;stroke-width:1.3}
    .db{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}
    .edge{stroke:#64748b;stroke-width:1.7;fill:none}
    .dash{stroke:#6366f1;stroke-width:1.3;fill:none;stroke-dasharray:4 3}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .dagfile{fill:#26262a;stroke:#6b7280}.sched{fill:#1e293b;stroke:#569cd6}.run{fill:#3a2e0a;stroke:#fbbf24}
      .exec{fill:#064e3b;stroke:#34d399}.db{fill:#1e1b3a;stroke:#818cf8}.edge{stroke:#9ca3af}.dash{stroke:#818cf8}
    }
  </style>
  <defs>
    <marker id="af-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
    <marker id="af-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="410"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="408.5" rx="10"/>
  <text class="label ink h" x="24" y="30">A DAG is a graph on a schedule &#8212; Airflow turns the file into runs and tracks them</text>

  <!-- pipeline row -->
  <rect class="dagfile" x="24" y="58" width="140" height="60" rx="8"/>
  <text class="label t ink" x="38" y="78" font-weight="700">DAG file (.py)</text>
  <text class="label mono muted" x="38" y="96">tasks + deps +</text>
  <text class="label mono muted" x="38" y="110">schedule (a graph)</text>
  <path class="edge" d="M164,88 L196,88" marker-end="url(#af-a)"/><text class="label s muted" x="166" y="82">parse</text>

  <rect class="sched" x="196" y="58" width="150" height="60" rx="8"/>
  <text class="label t ink" x="210" y="78" font-weight="700">Scheduler</text>
  <text class="label mono muted" x="210" y="96">parses files;</text>
  <text class="label mono muted" x="210" y="110">creates runs on time</text>
  <path class="edge" d="M346,88 L378,88" marker-end="url(#af-a)"/><text class="label s muted" x="348" y="82">interval</text>

  <rect class="run" x="378" y="58" width="150" height="60" rx="8"/>
  <text class="label t ink" x="392" y="78" font-weight="700">DAG Run</text>
  <text class="label mono muted" x="392" y="96">one per interval;</text>
  <text class="label mono muted" x="392" y="110">tasks &#8594; task instances</text>
  <path class="edge" d="M528,88 L560,88" marker-end="url(#af-a)"/>

  <rect class="exec" x="560" y="58" width="136" height="60" rx="8"/>
  <text class="label t ink" x="574" y="78" font-weight="700">Executor</text>
  <text class="label mono muted" x="574" y="96">+ workers run</text>
  <text class="label mono muted" x="574" y="110">each task instance</text>

  <!-- state machine -->
  <text class="label muted s" x="378" y="140">task instance state:</text>
  <text class="label mono ink" x="378" y="156">queued &#8594; running &#8594; <tspan class="green">success</tspan> / <tspan class="red">failed</tspan> / <tspan class="amber">up_for_retry</tspan></text>

  <!-- metadata DB -->
  <rect class="db" x="150" y="188" width="240" height="54" rx="9"/>
  <text class="label ink t" x="164" y="208" font-weight="700" fill="#6366f1">Metadata DB</text>
  <text class="label mono muted" x="164" y="226">state of every run &amp; task instance</text>
  <text class="label mono muted" x="164" y="238" font-size="9">the single source of truth</text>
  <path class="dash" d="M271,188 L271,118" marker-end="url(#af-d)"/>
  <path class="dash" d="M300,188 C430,180 560,150 620,120" marker-end="url(#af-d)"/>
  <text class="label s muted" x="410" y="176" fill="#6366f1">read / write state</text>

  <!-- web server -->
  <rect class="sched" x="430" y="188" width="266" height="54" rx="9"/>
  <text class="label ink t" x="444" y="208" font-weight="700">Web Server &#8594; UI</text>
  <text class="label mono muted" x="444" y="226">reads the DB to show graph, logs, run status</text>
  <text class="label mono muted" x="444" y="238" font-size="9">the scheduler runs tasks, not this UI</text>
  <path class="dash" d="M430,215 L390,215" marker-end="url(#af-d)"/>

  <line class="frame" x1="24" y1="264" x2="696" y2="264" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="286">The mental model: you write one <tspan class="ink" font-weight="700">DAG file</tspan>; the <tspan class="ink" font-weight="700">Scheduler</tspan> turns it into a <tspan class="ink" font-weight="700">DAG Run</tspan> every interval; each task becomes a</text>
  <text class="label muted s" x="24" y="304"><tspan class="ink" font-weight="700">task instance</tspan> the <tspan class="ink" font-weight="700">Executor</tspan> runs; and the <tspan class="ink" font-weight="700">Metadata DB</tspan> records the state that the Web UI shows. Nothing runs "now" &#8212;</text>
  <text class="label muted s" x="24" y="322">it runs on the schedule, per interval, and can re-run independently for any past date.</text>
  <text class="label muted s" x="24" y="348">"Acyclic" matters: tasks form a one-way graph with no loops, so the scheduler can always order them.</text>
  <text class="label muted s" x="24" y="374">Executors vary (Local, Celery, Kubernetes) but the lifecycle above is identical &#8212; only where tasks run changes.</text>
</svg>
