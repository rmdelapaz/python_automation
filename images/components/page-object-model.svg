<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="pom-title pom-desc" preserveAspectRatio="xMidYMid meet">
  <title id="pom-title">The Page Object Model keeps locators out of tests so a UI change touches one file</title>
  <desc id="pom-desc">A comparison of two test designs. On the left, without the Page Object Model, three test functions each embed the same raw locators such as find_element By id username. When the id is renamed, all three tests break. On the right, with the Page Object Model, a single LoginPage class holds the locators and exposes a login method; the three tests just call login_page.login. When the id is renamed, only that one line in the page class changes and the tests are untouched. Centralizing locators and page actions behind a class is what makes a large test suite maintainable.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .test{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
    .badbox{fill:#fef2f2;stroke:#ef4444;stroke-width:1.3}
    .pageobj{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}
    .goodbox{fill:#ecfdf5;stroke:#10b981;stroke-width:1.3}
    .bolt{fill:#f59e0b}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .test{fill:#26262a;stroke:#6b7280}.badbox{fill:#3a1a1a;stroke:#f87171}
      .pageobj{fill:#1e293b;stroke:#569cd6}.goodbox{fill:#064e3b;stroke:#34d399}.bolt{fill:#fbbf24}
    }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="420"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="418.5" rx="10"/>
  <text class="label ink h" x="24" y="30">One UI change: break every test, or edit one page class</text>

  <!-- LEFT: without POM -->
  <text class="label red ph" x="24" y="56">Without POM &#8212; locators copied into every test</text>
  <rect class="test" x="24" y="66" width="316" height="30" rx="5"/><text class="label mono ink" x="34" y="85">def test_login():  find(By.ID,"username")&#8230;</text>
  <rect class="test" x="24" y="100" width="316" height="30" rx="5"/><text class="label mono ink" x="34" y="119">def test_checkout(): find(By.ID,"username")&#8230;</text>
  <rect class="test" x="24" y="134" width="316" height="30" rx="5"/><text class="label mono ink" x="34" y="153">def test_profile(): find(By.ID,"username")&#8230;</text>

  <polygon class="bolt" points="176,172 168,192 182,192 174,214 196,188 184,188 192,172"/>
  <text class="label amber s" x="204" y="190" font-weight="700">id "username" renamed</text>

  <rect class="badbox" x="24" y="224" width="316" height="70" rx="7"/>
  <text class="label red t" x="38" y="246" font-weight="700">&#10007; All three tests break</text>
  <text class="label muted s" x="38" y="266">The same locator is duplicated across the suite, so</text>
  <text class="label muted s" x="38" y="282">a single markup change fails tests everywhere at once.</text>

  <!-- divider -->
  <line class="frame" x1="360" y1="48" x2="360" y2="330" stroke="#cbd5e1"/>

  <!-- RIGHT: with POM -->
  <text class="label green ph" x="380" y="56">With POM &#8212; locators live in one page class</text>
  <rect class="pageobj" x="380" y="66" width="316" height="76" rx="7"/>
  <text class="label blue t" x="394" y="86" font-weight="700">class LoginPage:</text>
  <text class="label mono ink" x="394" y="104">USERNAME = (By.ID, "username")</text>
  <text class="label mono ink" x="394" y="120">PASSWORD = (By.ID, "password")</text>
  <text class="label mono ink" x="394" y="136">def login(self, u, p): &#8230;</text>

  <rect class="test" x="380" y="150" width="316" height="26" rx="5"/><text class="label mono ink" x="392" y="167">test_login:    login_page.login(u, p)</text>
  <rect class="test" x="380" y="180" width="316" height="26" rx="5"/><text class="label mono ink" x="392" y="197">test_checkout: login_page.login(u, p)</text>
  <rect class="test" x="380" y="210" width="316" height="26" rx="5"/><text class="label mono ink" x="392" y="227">test_profile:  login_page.login(u, p)</text>

  <polygon class="bolt" points="530,244 522,262 536,262 528,282 550,258 538,258 546,244"/>
  <text class="label amber s" x="558" y="262" font-weight="700">same rename</text>

  <rect class="goodbox" x="380" y="290" width="316" height="40" rx="7"/>
  <text class="label green t" x="394" y="308" font-weight="700">&#10003; Edit one line in LoginPage</text>
  <text class="label muted s" x="394" y="324">Tests call methods, not locators &#8212; they never change.</text>

  <line class="frame" x1="24" y1="352" x2="696" y2="352" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="374">A Page Object wraps each page's locators and actions behind a class, so tests read like user stories</text>
  <text class="label muted s" x="24" y="392">(login, add_to_cart) and a UI change touches one file instead of rippling through the whole suite.</text>
</svg>
