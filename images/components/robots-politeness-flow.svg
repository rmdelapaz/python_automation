<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="rb-title rb-desc" preserveAspectRatio="xMidYMid meet">
  <title id="rb-title">A polite crawler's robots.txt decision flow and politeness rules</title>
  <desc id="rb-desc">A decision flow for a well-behaved scraper. Starting from a target URL, the crawler fetches and parses robots.txt once and caches it, reading the Allow, Disallow and Crawl-delay rules for its own User-Agent. It then asks whether the path is allowed. If no, it skips the URL and never requests it. If yes, it waits the Crawl-delay, fetches the page politely, then pauses before moving to the next URL, repeating the loop. A side panel lists politeness rules: send a real User-Agent with a contact, never fetch a disallowed path, honor the Crawl-delay, rate-limit even where allowed, cache robots.txt and re-check it later, and back off on 429 or 503 responses.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10.5px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .flow{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.3}
    .dia{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.6}
    .bad{fill:#fef2f2;stroke:#ef4444;stroke-width:1.4}
    .good{fill:#ecfdf5;stroke:#10b981;stroke-width:1.4}
    .edge{stroke:#64748b;stroke-width:1.7;fill:none}
    .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .flow{fill:#1e293b;stroke:#569cd6}.dia{fill:#3a2e0a;stroke:#fbbf24}
      .bad{fill:#3a1a1a;stroke:#f87171}.good{fill:#064e3b;stroke:#34d399}
      .edge{stroke:#9ca3af}.panel{fill:#26262a;stroke:#3f3f46}
    }
  </style>
  <defs>
    <marker id="rb-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="440"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="438.5" rx="10"/>
  <text class="label ink h" x="24" y="30">Scrape like a guest: check robots.txt, then fetch slowly &#8212; or skip</text>

  <!-- FLOW -->
  <rect class="flow" x="110" y="52" width="184" height="30" rx="6"/><text class="label mono ink" x="150" y="71">Target URL to fetch</text>
  <path class="edge" d="M202,82 L202,96" marker-end="url(#rb-a)"/>

  <rect class="flow" x="44" y="96" width="316" height="34" rx="6"/>
  <text class="label mono ink" x="56" y="110">GET /robots.txt &#8594; parse for my User-Agent</text>
  <text class="label mono muted" x="56" y="124">Allow / Disallow / Crawl-delay  (cache once)</text>
  <path class="edge" d="M202,130 L202,144" marker-end="url(#rb-a)"/>

  <!-- diamond -->
  <polygon class="dia" points="202,146 300,180 202,214 104,180"/>
  <text class="label t ink" x="202" y="176" text-anchor="middle">Path allowed</text>
  <text class="label t ink" x="202" y="192" text-anchor="middle">for my UA?</text>

  <!-- NO branch -->
  <path class="edge" d="M155,197 C120,214 110,222 96,236" marker-end="url(#rb-a)"/>
  <text class="label s red" x="112" y="224" font-weight="700">No</text>
  <rect class="bad" x="30" y="238" width="150" height="34" rx="6"/>
  <text class="label t red" x="48" y="253">Skip &#8212; never</text>
  <text class="label t red" x="48" y="267">request it</text>

  <!-- YES branch -->
  <path class="edge" d="M249,197 C284,214 294,222 300,236" marker-end="url(#rb-a)"/>
  <text class="label s green" x="284" y="224" font-weight="700">Yes</text>
  <rect class="good" x="214" y="238" width="176" height="34" rx="6"/>
  <text class="label t ink" x="228" y="253">Wait Crawl-delay:</text>
  <text class="label mono green" x="228" y="267">time.sleep(N)</text>
  <path class="edge" d="M302,272 L302,288" marker-end="url(#rb-a)"/>

  <rect class="good" x="214" y="288" width="176" height="30" rx="6"/><text class="label mono ink" x="228" y="307">Fetch page &#183; 200 OK</text>
  <path class="edge" d="M302,318 L302,332" marker-end="url(#rb-a)"/>

  <rect class="flow" x="214" y="332" width="176" height="30" rx="6"/><text class="label mono ink" x="228" y="351">Pause, then next URL</text>
  <!-- repeat loop back to robots box -->
  <path class="edge" d="M390,347 C420,347 408,140 362,116" marker-end="url(#rb-a)"/>
  <text class="label s muted" x="404" y="240" font-weight="700">repeat</text>

  <!-- PANEL -->
  <line class="frame" x1="430" y1="50" x2="430" y2="376" stroke="#cbd5e1"/>
  <rect class="panel" x="446" y="58" width="250" height="308" rx="9"/>
  <text class="label ink ph" x="462" y="82">Be a polite guest</text>
  <text class="label t ink" x="462" y="112">&#8226; Send a real User-Agent + contact</text>
  <text class="label t ink" x="462" y="142">&#8226; Never fetch a Disallow path</text>
  <text class="label t ink" x="462" y="172">&#8226; Honor Crawl-delay between hits</text>
  <text class="label t ink" x="462" y="202">&#8226; Rate-limit even where allowed</text>
  <text class="label t ink" x="462" y="232">&#8226; Cache robots.txt; re-check later</text>
  <text class="label t ink" x="462" y="262">&#8226; Back off on 429 / 503</text>
  <text class="label t ink" x="462" y="292">&#8226; Prefer an official API if one exists</text>
  <text class="label muted s" x="462" y="330">urllib.robotparser reads these rules</text>
  <text class="label muted s" x="462" y="346">for you: rp.can_fetch(ua, url).</text>

  <line class="frame" x1="24" y1="388" x2="696" y2="388" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="408">robots.txt is a request, not a lock &#8212; but honoring it, throttling, and identifying yourself are what keep your</text>
  <text class="label muted s" x="24" y="426">scraper welcome and your IP unbanned. Also check the site's Terms of Service; some data is off-limits by law.</text>
</svg>
