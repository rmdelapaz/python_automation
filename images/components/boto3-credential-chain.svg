<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="bo-title bo-desc" preserveAspectRatio="xMidYMid meet">
  <title id="bo-title">How boto3 finds AWS credentials through a provider chain, and client versus resource</title>
  <desc id="bo-desc">boto3 searches for credentials in a fixed order and uses the first source it finds. First, explicit keys passed in code, which you should avoid. Second, environment variables AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. Third, the shared credentials file at ~/.aws/credentials written by aws configure, selected by profile. Fourth, an IAM role delivered through instance or container metadata on EC2, ECS or Lambda, which is the best option because there are no long-lived keys. A side panel contrasts the two API styles: a client is low-level and maps one-to-one to the AWS API, while a resource is a higher-level object interface, and a Session bundles credentials and region.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .step{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.2}
    .avoid{fill:#fef2f2;stroke:#ef4444;stroke-width:1.3}
    .best{fill:#ecfdf5;stroke:#10b981;stroke-width:1.5}
    .edge{stroke:#64748b;stroke-width:1.6;fill:none}
    .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .step{fill:#1e293b;stroke:#569cd6}.avoid{fill:#3a1a1a;stroke:#f87171}.best{fill:#064e3b;stroke:#34d399}
      .edge{stroke:#9ca3af}.panel{fill:#26262a;stroke:#3f3f46}
    }
  </style>
  <defs>
    <marker id="bo-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="410"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="408.5" rx="10"/>
  <text class="label ink h" x="24" y="30">boto3 hunts for credentials in order &#8212; so you never hardcode keys</text>

  <!-- CHAIN -->
  <text class="label muted ph" x="24" y="56">Provider chain (first source found wins)</text>

  <rect class="avoid" x="24" y="64" width="420" height="40" rx="6"/>
  <text class="label t ink" x="38" y="82" font-weight="700">1. Explicit keys in code</text>
  <text class="label mono red" x="38" y="98">client(aws_access_key_id=&#8230;)  &#8212; avoid: leaks to git</text>
  <path class="edge" d="M234,104 L234,116" marker-end="url(#bo-a)"/><text class="label s muted" x="242" y="115">not set?</text>

  <rect class="step" x="24" y="118" width="420" height="40" rx="6"/>
  <text class="label t ink" x="38" y="136" font-weight="700">2. Environment variables</text>
  <text class="label mono muted" x="38" y="152">AWS_ACCESS_KEY_ID &#183; AWS_SECRET_ACCESS_KEY</text>
  <path class="edge" d="M234,158 L234,170" marker-end="url(#bo-a)"/><text class="label s muted" x="242" y="169">not set?</text>

  <rect class="step" x="24" y="172" width="420" height="40" rx="6"/>
  <text class="label t ink" x="38" y="190" font-weight="700">3. Shared credentials file</text>
  <text class="label mono muted" x="38" y="206">~/.aws/credentials [profile]  &#8212; via `aws configure`</text>
  <path class="edge" d="M234,212 L234,224" marker-end="url(#bo-a)"/><text class="label s muted" x="242" y="223">not there?</text>

  <rect class="best" x="24" y="226" width="420" height="48" rx="6"/>
  <text class="label t ink" x="38" y="244" font-weight="700">4. IAM role &#8212; instance / container metadata</text>
  <text class="label mono green" x="38" y="260">EC2 / ECS / Lambda &#8212; auto, rotating, NO keys to leak</text>
  <text class="label s green" x="38" y="272" font-weight="700">&#9733; best on AWS</text>

  <!-- PANEL -->
  <rect class="panel" x="460" y="64" width="236" height="210" rx="9"/>
  <text class="label ink ph" x="474" y="86">client vs resource</text>
  <text class="label blue s" x="474" y="110" font-weight="700">client &#8212; low-level</text>
  <text class="label mono muted" x="474" y="126">s3.list_objects_v2(</text>
  <text class="label mono muted" x="474" y="140">   Bucket="b")</text>
  <text class="label muted s" x="474" y="156">maps 1:1 to the AWS API</text>
  <text class="label green s" x="474" y="182" font-weight="700">resource &#8212; high-level</text>
  <text class="label mono muted" x="474" y="198">s3.Bucket("b")</text>
  <text class="label mono muted" x="474" y="212">  .objects.all()</text>
  <text class="label muted s" x="474" y="228">object interface, less code</text>
  <text class="label muted s" x="474" y="252">Session() bundles the</text>
  <text class="label muted s" x="474" y="266">credentials + region.</text>

  <line class="frame" x1="24" y1="298" x2="696" y2="298" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="320">Hardcoding keys is the classic AWS mistake &#8212; they get committed to GitHub and drained within minutes. Let the</text>
  <text class="label muted s" x="24" y="338">chain resolve credentials for you: env vars or a named profile locally, and on AWS attach an IAM role so there</text>
  <text class="label muted s" x="24" y="356">are no long-lived keys at all. The same chain works for every service, because credentials live on the Session.</text>
  <text class="label muted s" x="24" y="382">Set a region the same way: AWS_DEFAULT_REGION, the profile, or Session(region_name=&#8230;).</text>
</svg>
