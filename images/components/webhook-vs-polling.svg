<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="wh-title wh-desc" preserveAspectRatio="xMidYMid meet">
  <title id="wh-title">A webhook inverts polling: the provider pushes an event to your endpoint</title>
  <desc id="wh-desc">Two models compared. With polling, your client repeatedly sends GET requests asking if anything is new, and most replies say nothing yet, wasting calls and adding lag before it finally gets the event. With a webhook, when an event happens the provider sends a single HTTP POST to your endpoint URL carrying the event payload and a signature header. Your server verifies the signature by computing an HMAC of the raw body with the shared secret and comparing it to the header, then responds 200 quickly and processes the work asynchronously. A side panel lists the rules: verify the HMAC signature, return 2xx fast, do the real work in a background job, and make handling idempotent because providers retry.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .node{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.3}
    .poll{stroke:#94a3b8;stroke-width:1.6;fill:none}
    .pushline{stroke:#10b981;stroke-width:2;fill:none}
    .push{fill:#ecfdf5;stroke:#10b981;stroke-width:1.4}
    .sig{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}
    .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .node{fill:#26262a;stroke:#6b7280}.poll{stroke:#6b7280}.pushline{stroke:#34d399}
      .push{fill:#064e3b;stroke:#34d399}.sig{fill:#3a2e0a;stroke:#fbbf24}.panel{fill:#26262a;stroke:#3f3f46}
    }
  </style>
  <defs>
    <marker id="wh-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
    <marker id="wh-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10b981"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="410"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="408.5" rx="10"/>
  <text class="label ink h" x="24" y="30">Stop asking "anything new?" &#8212; let the provider tell you when it happens</text>

  <!-- POLLING -->
  <text class="label red ph" x="24" y="58">Polling &#8212; you ask, over and over</text>
  <rect class="node" x="24" y="68" width="120" height="40" rx="7"/><text class="label t ink" x="40" y="92">Your client</text>
  <rect class="node" x="556" y="68" width="120" height="40" rx="7"/><text class="label t ink" x="588" y="92">Provider</text>
  <path class="poll" d="M144,78 L556,78" marker-end="url(#wh-g)"/><text class="label mono muted" x="200" y="74">GET /events?  &#8594; 204 nothing yet</text>
  <path class="poll" d="M144,96 L556,96" marker-end="url(#wh-g)"/><text class="label mono muted" x="200" y="92">GET /events?  &#8594; 204 nothing yet</text>
  <path class="poll" d="M144,114 L556,114" marker-end="url(#wh-g)"/><text class="label mono amber" x="200" y="110">GET /events?  &#8594; 200 (finally!) &#8212; minutes late</text>
  <text class="label muted s" x="24" y="134">Wastes requests and hits rate limits; the update is always as stale as your interval.</text>

  <line class="frame" x1="24" y1="150" x2="696" y2="150" stroke="#cbd5e1"/>

  <!-- WEBHOOK -->
  <text class="label green ph" x="24" y="176">Webhook &#8212; the provider pushes on the event</text>
  <rect class="node" x="556" y="188" width="120" height="40" rx="7"/><text class="label t ink" x="588" y="212">Provider</text>
  <rect class="push" x="24" y="188" width="150" height="40" rx="7"/><text class="label t ink" x="40" y="204" font-weight="700">Your endpoint</text><text class="label mono muted" x="40" y="220" font-size="9">POST /webhook</text>
  <text class="label amber s" x="300" y="182" font-weight="700">event happens &#8594;</text>
  <path class="pushline" d="M556,206 L176,206" marker-end="url(#wh-p)"/>
  <text class="label mono green" x="240" y="222">POST payload + X-Signature</text>

  <!-- verify + respond -->
  <rect class="sig" x="24" y="238" width="360" height="66" rx="7"/>
  <text class="label amber t" x="38" y="256" font-weight="700">1. Verify it's really the provider</text>
  <text class="label mono ink" x="38" y="274">HMAC_SHA256(raw_body, SHARED_SECRET)</text>
  <text class="label mono ink" x="38" y="290">== request.headers["X-Signature"]  ?</text>
  <text class="label monos muted" x="38" y="301" font-size="9">use hmac.compare_digest; reject with 401 if it fails</text>

  <rect class="push" x="396" y="238" width="286" height="66" rx="7"/>
  <text class="label green t" x="410" y="256" font-weight="700">2. Acknowledge fast, work later</text>
  <text class="label mono ink" x="410" y="274">return 200 immediately</text>
  <text class="label mono muted" x="410" y="290">enqueue the job &#8594; process async</text>
  <text class="label monos muted" x="410" y="301" font-size="9">slow handlers cause provider timeouts + retries</text>

  <line class="frame" x1="24" y1="326" x2="696" y2="326" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="348">A webhook is just an HTTP endpoint <tspan class="ink" font-weight="700">you</tspan> host that the provider calls. Because anyone could POST to that URL, the</text>
  <text class="label muted s" x="24" y="366">signature check is not optional &#8212; it's how you prove the request is genuine. Return 2xx quickly, then do the work.</text>
  <text class="label muted s" x="24" y="392">Make handling idempotent: providers retry on timeout, so the same event may arrive more than once.</text>
</svg>
