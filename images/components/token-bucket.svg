<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="tb-title tb-desc" preserveAspectRatio="xMidYMid meet">
  <title id="tb-title">The token-bucket rate-limiting algorithm</title>
  <desc id="tb-desc">A faucet drips tokens into a bucket at a fixed refill rate up to a fixed capacity. Each API request removes one token: if a token is available the request is allowed, and when the bucket is empty requests are throttled until it refills. The spare capacity is what lets short bursts through.</desc>
  <style>
    .bg { fill: #ffffff; }
    .frame { fill: none; stroke: #cbd5e1; stroke-width: 1.5; }
    .ink { fill: #1e293b; }
    .muted { fill: #64748b; }
    .label { font-family: 'Segoe UI', system-ui, sans-serif; }
    .h { font-size: 15px; font-weight: 700; }
    .t { font-size: 12.5px; }
    .s { font-size: 11px; }
    .mono { font-family: 'Consolas', 'SF Mono', monospace; font-size: 11.5px; }
    .blue { fill: #3b82f6; }
    .bluestroke { stroke: #3b82f6; }
    .amber { fill: #f59e0b; }
    .amberstroke { stroke: #f59e0b; }
    .green { fill: #10b981; }
    .greenstroke { stroke: #10b981; }
    .red { fill: #ef4444; }
    .redstroke { stroke: #ef4444; }
    .bucketwall { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; }
    .coin { fill: #f59e0b; stroke: #b45309; stroke-width: 1; }
    .cointext { fill: #7c2d12; font-family: 'Consolas', monospace; font-size: 9px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1e1e1e; }
      .frame { stroke: #3f3f46; }
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .blue { fill: #569cd6; }
      .bluestroke { stroke: #569cd6; }
      .amber { fill: #fbbf24; }
      .amberstroke { stroke: #fbbf24; }
      .green { fill: #34d399; }
      .greenstroke { stroke: #34d399; }
      .red { fill: #f87171; }
      .redstroke { stroke: #f87171; }
      .bucketwall { fill: #1e293b; stroke: #569cd6; }
      .coin { fill: #fbbf24; stroke: #92400e; }
      .cointext { fill: #451a03; }
    }
  </style>
  <defs>
    <marker id="tb-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="muted"/>
    </marker>
    <marker id="tb-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="green"/>
    </marker>
    <marker id="tb-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="red"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="720" height="400"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="398.5" rx="10"/>

  <text class="label ink h" x="24" y="34">Token Bucket: bursts allowed, average rate capped</text>

  <!-- ============ REFILL FAUCET ============ -->
  <g transform="translate(0,0)">
    <rect class="amber" x="150" y="58" width="46" height="14" rx="3"/>
    <path d="M173,72 L173,86" class="amberstroke" stroke-width="8" fill="none"/>
    <text class="label muted s" x="205" y="70">refill: +R tokens / sec</text>
    <text class="label muted s" x="205" y="84">(the sustained rate)</text>
    <!-- drip tokens -->
    <circle class="coin" cx="173" cy="98" r="7"/>
    <circle class="coin" cx="173" cy="116" r="6" opacity="0.7"/>
  </g>

  <!-- ============ BUCKET ============ -->
  <g transform="translate(0,0)">
    <!-- bucket body: open trapezoid -->
    <path class="bucketwall" d="M120,150 L226,150 L214,300 L132,300 Z"/>
    <!-- tokens inside -->
    <circle class="coin" cx="150" cy="278" r="10"/><text class="cointext" x="150" y="281" text-anchor="middle">T</text>
    <circle class="coin" cx="176" cy="280" r="10"/><text class="cointext" x="176" y="283" text-anchor="middle">T</text>
    <circle class="coin" cx="196" cy="278" r="10"/><text class="cointext" x="196" y="281" text-anchor="middle">T</text>
    <circle class="coin" cx="160" cy="256" r="10"/><text class="cointext" x="160" y="259" text-anchor="middle">T</text>
    <circle class="coin" cx="185" cy="256" r="10"/><text class="cointext" x="185" y="259" text-anchor="middle">T</text>
    <!-- capacity line -->
    <line class="bluestroke" x1="120" y1="150" x2="226" y2="150" stroke-width="2" stroke-dasharray="5 4"/>
    <text class="label blue s" x="173" y="142" text-anchor="middle">capacity = burst limit (max tokens)</text>
    <text class="label muted s" x="173" y="322" text-anchor="middle">bucket = tokens available right now</text>
  </g>

  <!-- flow arrow bucket -> requests -->
  <line x1="230" y1="225" x2="286" y2="225" class="frame" stroke="#94a3b8" stroke-width="2" marker-end="url(#tb-arrow)"/>
  <text class="label muted s" x="258" y="216" text-anchor="middle">spend</text>

  <!-- ============ REQUESTS ============ -->
  <g transform="translate(0,0)">
    <text class="label ink t" x="300" y="130" font-weight="700">Each request tries to take 1 token</text>

    <!-- request A: allowed -->
    <rect class="frame" x="300" y="148" width="150" height="40" rx="6" fill="#eff6ff"/>
    <text class="label ink t" x="312" y="166">GET /api/users</text>
    <text class="label muted s" x="312" y="181">request A</text>
    <line x1="454" y1="168" x2="512" y2="168" class="greenstroke" stroke-width="2.5" marker-end="url(#tb-arrow-green)"/>
    <circle class="coin" cx="474" cy="152" r="7"/>
    <text class="label green t" x="520" y="164" font-weight="700">200 OK</text>
    <text class="label muted s" x="520" y="179">token spent, allowed</text>

    <!-- request B: allowed (burst) -->
    <rect class="frame" x="300" y="206" width="150" height="40" rx="6" fill="#eff6ff"/>
    <text class="label ink t" x="312" y="224">POST /api/order</text>
    <text class="label muted s" x="312" y="239">request B (burst)</text>
    <line x1="454" y1="226" x2="512" y2="226" class="greenstroke" stroke-width="2.5" marker-end="url(#tb-arrow-green)"/>
    <text class="label green t" x="520" y="222" font-weight="700">200 OK</text>
    <text class="label muted s" x="520" y="237">spare capacity absorbs it</text>

    <!-- request C: blocked -->
    <rect class="frame" x="300" y="264" width="150" height="40" rx="6" fill="#fef2f2"/>
    <text class="label ink t" x="312" y="282">GET /api/feed</text>
    <text class="label muted s" x="312" y="297">request C (empty)</text>
    <line x1="454" y1="284" x2="512" y2="284" class="redstroke" stroke-width="2.5" marker-end="url(#tb-arrow-red)"/>
    <text class="label red t" x="520" y="280" font-weight="700">429</text>
    <text class="label muted s" x="520" y="295">no token: wait / back off</text>
  </g>

  <!-- caption strip -->
  <line class="frame" x1="24" y1="352" x2="696" y2="352" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="372">Tokens refill at a steady rate R, so the long-run average never exceeds R, yet a full bucket lets a</text>
  <text class="label muted s" x="24" y="387">short burst through instantly &#8212; the client-side mirror of the limit an API enforces on you.</text>
</svg>
