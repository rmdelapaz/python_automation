<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="ws-title ws-desc" preserveAspectRatio="xMidYMid meet">
  <title id="ws-title">Why Selenium needs waits: the script races ahead of the page's async rendering</title>
  <desc id="ws-desc">A timeline measured from driver.get(). The target element enters the DOM at about 1.1 seconds and becomes clickable at about 1.3 seconds. Three strategies are compared. With no wait, find_element is called at time zero and fails with NoSuchElementException because it looked before the element existed. With an implicit wait, the driver polls repeatedly for the element's existence and returns as soon as it is present, at about 1.1 seconds. With an explicit wait, WebDriverWait polls for a specific condition such as element_to_be_clickable and proceeds only when that condition holds, at about 1.3 seconds. Explicit waits target the exact readiness a step needs and are the robust default.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.bluestroke{stroke:#3b82f6}.green{fill:#10b981}.greenstroke{stroke:#10b981}
    .amber{fill:#f59e0b}.red{fill:#ef4444}.redstroke{stroke:#ef4444}
    .axis{stroke:#94a3b8;stroke-width:1.4}
    .guide{stroke:#f59e0b;stroke-width:1.3;stroke-dasharray:4 4}
    .poll{stroke:#3b82f6;stroke-width:1.6;stroke-dasharray:2 5}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.bluestroke{stroke:#569cd6}.green{fill:#34d399}.greenstroke{stroke:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}.redstroke{stroke:#f87171}
      .axis{stroke:#6b7280}.guide{stroke:#fbbf24}.poll{stroke:#569cd6}
    }
  </style>
  <defs>
    <marker id="ws-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="410"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="408.5" rx="10"/>
  <text class="label ink h" x="24" y="30">The page renders asynchronously &#8212; a wait is how your script lets it catch up</text>

  <!-- guide labels -->
  <text class="label s amber" x="376" y="92" text-anchor="end" font-weight="700">in DOM &#8595;</text>
  <text class="label s amber" x="424" y="92" text-anchor="start" font-weight="700">&#8595; clickable</text>

  <!-- guides -->
  <line class="guide" x1="380" y1="96" x2="380" y2="300"/>
  <line class="guide" x1="420" y1="96" x2="420" y2="300"/>

  <!-- axis -->
  <line class="axis" x1="160" y1="108" x2="675" y2="108" marker-end="url(#ws-a)"/>
  <text class="label s muted" x="600" y="126">time after driver.get()</text>
  <line class="axis" x1="160" y1="104" x2="160" y2="112"/><text class="label s muted" x="160" y="126" text-anchor="middle">0</text>
  <line class="axis" x1="260" y1="104" x2="260" y2="112"/><text class="label s muted" x="260" y="126" text-anchor="middle">0.5s</text>
  <line class="axis" x1="360" y1="104" x2="360" y2="112"/><text class="label s muted" x="360" y="126" text-anchor="middle">1s</text>
  <line class="axis" x1="460" y1="104" x2="460" y2="112"/><text class="label s muted" x="460" y="126" text-anchor="middle">1.5s</text>
  <line class="axis" x1="560" y1="104" x2="560" y2="112"/><text class="label s muted" x="560" y="126" text-anchor="middle">2s</text>

  <!-- LANE A: no wait -->
  <text class="label t ink" x="24" y="158" font-weight="700">No wait</text>
  <circle class="red" cx="160" cy="152" r="5"/>
  <text class="label mono red" x="172" y="156">find_element() &#8594; &#10007; NoSuchElementException (looked at t=0)</text>
  <text class="label s muted" x="172" y="172">The script runs faster than the page; the element isn't there yet.</text>

  <!-- LANE B: implicit -->
  <text class="label t ink" x="24" y="218" font-weight="700">Implicit</text>
  <line class="poll" x1="160" y1="212" x2="378" y2="212"/>
  <circle class="green" cx="380" cy="212" r="6"/>
  <text class="label mono green" x="392" y="216">&#10003; returns when present  ~1.1s</text>
  <text class="label s muted" x="172" y="232">A global setting: the driver polls for existence only, and applies to every find.</text>

  <!-- LANE C: explicit -->
  <text class="label t ink" x="24" y="278" font-weight="700">Explicit</text>
  <line class="poll" x1="160" y1="272" x2="418" y2="272"/>
  <circle class="green" cx="420" cy="272" r="6"/>
  <text class="label mono green" x="432" y="276">&#10003; proceeds when clickable  ~1.3s</text>
  <text class="label s muted" x="172" y="292">WebDriverWait(...).until(EC.element_to_be_clickable) &#8212; polls a condition you choose.</text>

  <line class="frame" x1="24" y1="320" x2="696" y2="320" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="342">No wait races the page and fails intermittently. An implicit wait is a blunt global poll for mere existence. An</text>
  <text class="label muted s" x="24" y="360">explicit wait targets the exact condition a step needs &#8212; the robust default. Don't mix implicit and explicit waits.</text>
  <text class="label muted s" x="24" y="386">Rule of thumb: reach for WebDriverWait + expected_conditions per interaction, not a single blanket timeout.</text>
</svg>
