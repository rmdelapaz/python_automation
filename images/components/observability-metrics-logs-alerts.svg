<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="ob-title ob-desc" preserveAspectRatio="xMidYMid meet">
  <title id="ob-title">Observability rests on metrics, logs and alerts, and an alert is a rule on a metric</title>
  <desc id="ob-desc">The three pillars of observability. Metrics are numbers over time such as task duration, failure rate and queue depth, good for trends and thresholds. Logs are timestamped events with context, good for asking why something happened. Alerts are rules on a metric that notify a human. Below, the alert pipeline: a metric stream feeds a rule or SLA such as failure rate over 5 percent or an SLA miss; when the condition is breached the alert fires, is routed by severity, notifies a channel like Slack, email or PagerDuty, and escalates if it is not acknowledged. A caution warns to alert on user-facing symptoms like SLA breaches, not every blip, to avoid alert fatigue.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .metrics{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.4}
    .logs{fill:#ecfdf5;stroke:#10b981;stroke-width:1.4}
    .alerts{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.4}
    .step{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
    .fire{fill:#fef2f2;stroke:#ef4444;stroke-width:1.3}
    .edge{stroke:#64748b;stroke-width:1.7;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .metrics{fill:#1e293b;stroke:#569cd6}.logs{fill:#064e3b;stroke:#34d399}.alerts{fill:#3a2e0a;stroke:#fbbf24}
      .step{fill:#26262a;stroke:#6b7280}.fire{fill:#3a1a1a;stroke:#f87171}.edge{stroke:#9ca3af}
    }
  </style>
  <defs>
    <marker id="ob-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="410"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="408.5" rx="10"/>
  <text class="label ink h" x="24" y="30">Metrics, logs, alerts &#8212; and an alert is just a rule on a metric that pages a human</text>

  <!-- THREE PILLARS -->
  <rect class="metrics" x="24" y="46" width="216" height="96" rx="8"/>
  <text class="label blue ph" x="38" y="66">Metrics</text>
  <text class="label muted s" x="38" y="84">numbers over time</text>
  <text class="label mono muted" x="38" y="102">task duration, fail rate,</text>
  <text class="label mono muted" x="38" y="116">queue depth</text>
  <text class="label s ink" x="38" y="134">&#8594; trends &amp; thresholds</text>

  <rect class="logs" x="252" y="46" width="216" height="96" rx="8"/>
  <text class="label green ph" x="266" y="66">Logs</text>
  <text class="label muted s" x="266" y="84">timestamped events</text>
  <text class="label mono muted" x="266" y="102">with context: which run,</text>
  <text class="label mono muted" x="266" y="116">task, error, inputs</text>
  <text class="label s ink" x="266" y="134">&#8594; answer "why?"</text>

  <rect class="alerts" x="480" y="46" width="216" height="96" rx="8"/>
  <text class="label amber ph" x="494" y="66">Alerts</text>
  <text class="label muted s" x="494" y="84">a rule on a metric</text>
  <text class="label mono muted" x="494" y="102">that notifies a human</text>
  <text class="label mono muted" x="494" y="116">when something's wrong</text>
  <text class="label s ink" x="494" y="134">&#8594; wake the right person</text>

  <!-- ALERT PIPELINE -->
  <text class="label muted ph" x="24" y="172">The alert pipeline</text>
  <rect class="metrics" x="24" y="182" width="112" height="44" rx="7"/><text class="label t ink" x="36" y="200" font-weight="700">metric stream</text><text class="label mono muted" x="36" y="216" font-size="9">fail_rate, SLA</text>
  <path class="edge" d="M136,204 L164,204" marker-end="url(#ob-a)"/>
  <rect class="step" x="164" y="182" width="132" height="44" rx="7"/><text class="label t ink" x="176" y="200" font-weight="700">rule / SLA</text><text class="label mono muted" x="176" y="216" font-size="9">fail_rate &#62; 5% ?</text>
  <path class="edge" d="M296,204 L324,204" marker-end="url(#ob-a)"/>
  <rect class="fire" x="324" y="182" width="104" height="44" rx="7"/><text class="label red t" x="336" y="200" font-weight="700">breached</text><text class="label mono muted" x="336" y="216" font-size="9">alert fires</text>
  <path class="edge" d="M428,204 L456,204" marker-end="url(#ob-a)"/>
  <rect class="step" x="456" y="182" width="112" height="44" rx="7"/><text class="label t ink" x="468" y="200" font-weight="700">route by sev</text><text class="label mono muted" x="468" y="216" font-size="9">Slack / page</text>
  <path class="edge" d="M568,204 L596,204" marker-end="url(#ob-a)"/>
  <rect class="alerts" x="596" y="182" width="100" height="44" rx="7"/><text class="label amber t" x="608" y="200" font-weight="700">escalate</text><text class="label mono muted" x="608" y="216" font-size="9">if unacked</text>

  <!-- caution -->
  <rect class="fire" x="24" y="244" width="672" height="52" rx="8"/>
  <text class="label red ph" x="38" y="264">Alert on symptoms users feel, not every blip</text>
  <text class="label muted s" x="38" y="284">A page for one retried task trains people to ignore alerts. Alert on SLA breaches &amp; sustained failure; log the rest.</text>

  <line class="frame" x1="24" y1="316" x2="696" y2="316" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="338">Metrics tell you <tspan class="ink" font-weight="700">something</tspan> is wrong and let you set thresholds; logs tell you <tspan class="ink" font-weight="700">why</tspan>; alerts turn a threshold into</text>
  <text class="label muted s" x="24" y="356">action by paging someone. In Airflow: SLA misses, task-duration and failure metrics, and on_failure callbacks feed</text>
  <text class="label muted s" x="24" y="374">the pipeline; ship metrics to Prometheus/Grafana and route pages through Slack or PagerDuty by severity.</text>
  <text class="label muted s" x="24" y="398">Every alert should be actionable and point at a runbook &#8212; if there's nothing to do, it should be a log line, not a page.</text>
</svg>
