<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="os-title os-desc" preserveAspectRatio="xMidYMid meet">
  <title id="os-title">Object storage is a flat key-to-blob store, and signed URLs grant temporary direct access</title>
  <desc id="os-desc">Object storage explained. A bucket holds objects, each a key string plus a blob plus metadata; the keys look like paths such as reports/2024/q1.pdf, but the namespace is flat and the slashes are only prefixes, not real folders. To let someone download or upload directly without credentials, your server generates a signed URL from the bucket, key and an expiry using its own credentials, hands that URL to the client, and the client transfers the object straight from cloud storage until the URL expires. A side panel lists storage classes trading cost against retrieval: Standard is hot and instant, Nearline and Coldline are cheaper to store, and Archive is cheapest to store but slow and costly to retrieve.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .bucket{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.4}
    .obj{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
    .node{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
    .signed{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.3}
    .edge{stroke:#64748b;stroke-width:1.6;fill:none}
    .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .bucket{fill:#1e293b;stroke:#569cd6}.obj{fill:#26262a;stroke:#6b7280}.node{fill:#26262a;stroke:#6b7280}
      .signed{fill:#3a2e0a;stroke:#fbbf24}.edge{stroke:#9ca3af}.panel{fill:#26262a;stroke:#3f3f46}
    }
  </style>
  <defs>
    <marker id="os-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="410"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="408.5" rx="10"/>
  <text class="label ink h" x="24" y="30">A bucket is a flat key&#8594;blob store &#8212; and a signed URL is a time-limited pass</text>

  <!-- BUCKET -->
  <text class="label muted ph" x="24" y="56">Bucket = keys mapped to blobs</text>
  <rect class="bucket" x="24" y="64" width="330" height="150" rx="8"/>
  <text class="label blue t" x="38" y="84" font-weight="700">my-bucket</text>
  <rect class="obj" x="38" y="92" width="302" height="26" rx="4"/><text class="label mono ink" x="48" y="109"><tspan class="amber">reports/2024/</tspan>q1.pdf</text>
  <rect class="obj" x="38" y="122" width="302" height="26" rx="4"/><text class="label mono ink" x="48" y="139"><tspan class="amber">reports/2024/</tspan>q2.pdf</text>
  <rect class="obj" x="38" y="152" width="302" height="26" rx="4"/><text class="label mono ink" x="48" y="169"><tspan class="amber">img/</tspan>logo.png</text>
  <text class="label muted s" x="38" y="196">each object = key + blob + metadata</text>
  <text class="label amber s" x="38" y="209" font-weight="700">the "/" are prefixes, NOT real folders</text>

  <!-- STORAGE CLASSES PANEL -->
  <rect class="panel" x="372" y="64" width="324" height="150" rx="8"/>
  <text class="label ink ph" x="386" y="84">Storage classes: cost vs retrieval</text>
  <text class="label green s" x="386" y="108" font-weight="700">Standard</text><text class="label muted s" x="470" y="108">hot &#183; instant &#183; costs most to store</text>
  <text class="label blue s" x="386" y="132" font-weight="700">Nearline</text><text class="label muted s" x="470" y="132">cheaper store &#183; access ~monthly</text>
  <text class="label blue s" x="386" y="156" font-weight="700">Coldline</text><text class="label muted s" x="470" y="156">cheaper still &#183; access ~quarterly</text>
  <text class="label amber s" x="386" y="180" font-weight="700">Archive</text><text class="label muted s" x="470" y="180">cheapest store &#183; slow, costly to read</text>
  <text class="label muted s" x="386" y="202">Lifecycle rules move old objects down automatically.</text>

  <!-- SIGNED URL FLOW -->
  <text class="label muted ph" x="24" y="240">Signed URL &#8212; direct access without sharing credentials</text>
  <rect class="node" x="24" y="250" width="150" height="46" rx="7"/>
  <text class="label t ink" x="38" y="268" font-weight="700">Your server</text>
  <text class="label mono muted" x="38" y="284" font-size="9">has cloud credentials</text>
  <path class="edge" d="M174,273 L214,273" marker-end="url(#os-a)"/>
  <text class="label s muted" x="176" y="266">signs</text>

  <rect class="signed" x="214" y="250" width="240" height="46" rx="7"/>
  <text class="label amber t" x="228" y="268" font-weight="700">Signed URL</text>
  <text class="label mono muted" x="228" y="284" font-size="9">bucket + key + expiry + signature</text>
  <path class="edge" d="M454,273 L494,273" marker-end="url(#os-a)"/>
  <text class="label s muted" x="456" y="266">hand to</text>

  <rect class="node" x="494" y="250" width="202" height="46" rx="7"/>
  <text class="label t ink" x="508" y="268" font-weight="700">Client / browser</text>
  <text class="label mono green" x="508" y="284" font-size="9">GET blob straight from storage</text>

  <text class="label muted s" x="24" y="314">No credentials leave your server; the link works only for that object and only until it expires.</text>

  <line class="frame" x1="24" y1="330" x2="696" y2="330" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="352">Because storage is a flat key&#8594;blob map, "listing a folder" is really listing keys by prefix, and moving a "folder"</text>
  <text class="label muted s" x="24" y="370">means copying every object. Signed URLs let clients upload or download huge files directly &#8212; your app never</text>
  <text class="label muted s" x="24" y="388">proxies the bytes &#8212; while your bucket stays private. generate_presigned_url (boto3) / blob.generate_signed_url (GCS).</text>
</svg>
