<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="sl-title sl-desc" preserveAspectRatio="xMidYMid meet">
  <title id="sl-title">The serverless execution model: an event runs a function that scales to zero</title>
  <desc id="sl-desc">How a serverless function runs. An event from an HTTP or API gateway, a storage change, a queue message, or a schedule triggers the platform. The platform checks whether a warm instance is available. If not, it does a cold start: provision a runtime and load your code, which makes the first call slower. If a warm instance exists, it is reused and the call is fast. Either way the handler function, taking an event and a context, runs and returns a response. After a period of idle, instances are frozen and then destroyed, scaling to zero. A footer explains you pay per invocation and duration, not for idle time, and that the platform runs many instances in parallel to absorb bursts, with cold starts as the main trade-off.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .evt{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.2}
    .dia{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.6}
    .cold{fill:#fef2f2;stroke:#ef4444;stroke-width:1.3}
    .warm{fill:#ecfdf5;stroke:#10b981;stroke-width:1.3}
    .run{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.3}
    .edge{stroke:#64748b;stroke-width:1.6;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .evt{fill:#1e293b;stroke:#569cd6}.dia{fill:#3a2e0a;stroke:#fbbf24}.cold{fill:#3a1a1a;stroke:#f87171}
      .warm{fill:#064e3b;stroke:#34d399}.run{fill:#26262a;stroke:#6b7280}.edge{stroke:#9ca3af}
    }
  </style>
  <defs>
    <marker id="sl-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="410"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="408.5" rx="10"/>
  <text class="label ink h" x="24" y="30">No server runs until an event arrives &#8212; then a function spins up, runs, and vanishes</text>

  <!-- EVENT SOURCES -->
  <text class="label muted ph" x="24" y="58">Event source</text>
  <rect class="evt" x="24" y="66" width="150" height="120" rx="8"/>
  <text class="label mono ink" x="36" y="88">HTTP / API GW</text>
  <text class="label mono ink" x="36" y="110">storage change</text>
  <text class="label mono ink" x="36" y="132">queue message</text>
  <text class="label mono ink" x="36" y="154">schedule (cron)</text>
  <text class="label muted s" x="36" y="176">any one triggers &#8594;</text>
  <path class="edge" d="M174,126 L206,126" marker-end="url(#sl-a)"/>

  <!-- decision cold/warm -->
  <polygon class="dia" points="290,96 372,126 290,156 208,126"/>
  <text class="label s ink" x="290" y="122" text-anchor="middle">Warm instance</text>
  <text class="label s ink" x="290" y="136" text-anchor="middle">available?</text>

  <path class="edge" d="M290,156 L290,182" marker-end="url(#sl-a)"/><text class="label s red" x="296" y="176" font-weight="700">No</text>
  <rect class="cold" x="196" y="184" width="188" height="44" rx="6"/>
  <text class="label red t" x="210" y="202" font-weight="700">Cold start</text>
  <text class="label mono muted" x="210" y="218" font-size="9">provision runtime + load code (slower)</text>

  <path class="edge" d="M372,126 L470,126" marker-end="url(#sl-a)"/><text class="label s green" x="392" y="120" font-weight="700">Yes</text>
  <rect class="warm" x="470" y="104" width="150" height="44" rx="6"/>
  <text class="label green t" x="484" y="122" font-weight="700">Warm reuse</text>
  <text class="label mono muted" x="484" y="138" font-size="9">frozen instance thaws (fast)</text>

  <!-- run -->
  <path class="edge" d="M384,206 C440,206 470,180 500,158" marker-end="url(#sl-a)"/>
  <path class="edge" d="M545,148 L545,176" marker-end="url(#sl-a)"/>
  <rect class="run" x="440" y="178" width="230" height="46" rx="7"/>
  <text class="label t ink" x="454" y="196" font-weight="700">handler(event, context)</text>
  <text class="label mono muted" x="454" y="214" font-size="9">runs your code &#8594; returns a response</text>

  <!-- scale to zero -->
  <path class="edge" d="M555,224 L555,248" marker-end="url(#sl-a)"/>
  <rect class="evt" x="360" y="250" width="336" height="42" rx="7"/>
  <text class="label blue t" x="374" y="268" font-weight="700">Idle &#8594; freeze &#8594; destroy = scale to zero</text>
  <text class="label mono muted" x="374" y="284" font-size="9">no instances, no cost, when nothing is calling</text>

  <!-- parallel note -->
  <rect class="warm" x="24" y="250" width="316" height="42" rx="7"/>
  <text class="label green t" x="38" y="268" font-weight="700">Bursts &#8594; many instances in parallel</text>
  <text class="label mono muted" x="38" y="284" font-size="9">the platform scales out per concurrent event</text>

  <line class="frame" x1="24" y1="312" x2="696" y2="312" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="334">"Serverless" doesn't mean no servers &#8212; it means you never manage them. You ship one function; the platform runs</text>
  <text class="label muted s" x="24" y="352">it per event, scales out for bursts, and scales to zero when idle, so you pay per <tspan class="ink" font-weight="700">invocation + duration</tspan>, not for uptime.</text>
  <text class="label muted s" x="24" y="378">The trade-off is the cold start; keep functions small, dependencies light, and warm the hot paths if latency matters.</text>
</svg>
