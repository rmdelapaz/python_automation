<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="sm-title sm-desc" preserveAspectRatio="xMidYMid meet">
  <title id="sm-title">Why requests.Session keeps you logged in but bare requests calls do not</title>
  <desc id="sm-desc">A comparison of two approaches over three calls. In the top row, bare requests calls are used: the login response sets a cookie but each call is an independent connection that discards it, so the following data and profile calls arrive with no cookie and are answered 401 Unauthorized. In the bottom row, a single requests.Session object holds one cookie jar: the login stores the authenticated session cookie in the jar, and the later data and profile calls automatically re-attach that cookie, so both return 200. One shared cookie jar is what turns three separate requests into one logged-in session.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10.5px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.greenstroke{stroke:#10b981}
    .amber{fill:#f59e0b}.red{fill:#ef4444}.redstroke{stroke:#ef4444}
    .call{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.3}
    .bad{fill:#fef2f2;stroke:#ef4444;stroke-width:1.3}
    .good{fill:#ecfdf5;stroke:#10b981;stroke-width:1.3}
    .jar{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.6}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.greenstroke{stroke:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}.redstroke{stroke:#f87171}
      .call{fill:#26262a;stroke:#6b7280}.bad{fill:#3a1a1a;stroke:#f87171}.good{fill:#064e3b;stroke:#34d399}
      .jar{fill:#1e293b;stroke:#569cd6}
    }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="440"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="438.5" rx="10"/>
  <text class="label ink h" x="24" y="30">Three calls, one login &#8212; only a shared cookie jar keeps you authenticated</text>

  <!-- ROW A: stateless -->
  <text class="label red ph" x="24" y="58">Bare requests.get() / .post() &#8212; every call is a new connection, the cookie is dropped</text>
  <!-- call 1 -->
  <rect class="call" x="30" y="70" width="200" height="30" rx="5"/><text class="label mono ink" x="42" y="89">requests.post("/login")</text>
  <rect class="bad" x="30" y="106" width="200" height="24" rx="4"/><text class="label mono red" x="42" y="122">Set-Cookie sid &#8212; discarded</text>
  <!-- call 2 -->
  <rect class="call" x="262" y="70" width="196" height="30" rx="5"/><text class="label mono ink" x="274" y="89">requests.get("/data")</text>
  <rect class="bad" x="262" y="106" width="196" height="24" rx="4"/><text class="label mono red" x="274" y="122">no cookie &#8594; 401 Unauthorized</text>
  <!-- call 3 -->
  <rect class="call" x="490" y="70" width="200" height="30" rx="5"/><text class="label mono ink" x="502" y="89">requests.get("/profile")</text>
  <rect class="bad" x="490" y="106" width="200" height="24" rx="4"/><text class="label mono red" x="502" y="122">no cookie &#8594; 401 Unauthorized</text>
  <text class="label muted s" x="30" y="152">Nothing carries state between calls, so the server treats calls 2 and 3 as strangers.</text>

  <line class="frame" x1="24" y1="176" x2="696" y2="176" stroke="#cbd5e1"/>

  <!-- ROW B: session -->
  <text class="label green ph" x="24" y="202">requests.Session() &#8212; one object, one cookie jar reused automatically</text>
  <!-- jar container -->
  <rect class="jar" x="30" y="214" width="660" height="146" rx="9"/>
  <text class="label blue ph" x="46" y="234">session cookie jar</text>
  <rect class="good" x="196" y="220" width="180" height="22" rx="11"/><text class="label mono green" x="210" y="235">holds sid=AUTH across calls</text>
  <!-- call 1 -->
  <rect class="call" x="46" y="256" width="196" height="30" rx="5"/><text class="label mono ink" x="58" y="275">s.post("/login")</text>
  <rect class="good" x="46" y="292" width="196" height="24" rx="4"/><text class="label mono green" x="58" y="308">jar &#8592; sid=AUTH  (stored)</text>
  <!-- call 2 -->
  <rect class="call" x="262" y="256" width="196" height="30" rx="5"/><text class="label mono ink" x="274" y="275">s.get("/data")</text>
  <rect class="good" x="262" y="292" width="196" height="24" rx="4"/><text class="label mono green" x="274" y="308">jar &#8594; sid  &#183;  200 OK</text>
  <!-- call 3 -->
  <rect class="call" x="478" y="256" width="196" height="30" rx="5"/><text class="label mono ink" x="490" y="275">s.get("/profile")</text>
  <rect class="good" x="478" y="292" width="196" height="24" rx="4"/><text class="label mono green" x="490" y="308">jar &#8594; sid  &#183;  200 OK</text>
  <text class="label muted s" x="46" y="340">The jar attaches the stored cookie to every later call &#8212; the three requests become one session.</text>

  <line class="frame" x1="24" y1="382" x2="696" y2="382" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="402">A Session also reuses the underlying TCP connection and shared headers, so it is faster too. Reach for a bare</text>
  <text class="label muted s" x="24" y="420">requests call only for one-off, unauthenticated fetches; anything with a login wants a Session.</text>
</svg>
