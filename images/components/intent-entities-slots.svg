<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="ne-title ne-desc" preserveAspectRatio="xMidYMid meet">
  <title id="ne-title">Understanding a message: classify the intent, extract the entities, fill the missing slots</title>
  <desc id="ne-desc">Turning a user's sentence into an action has three parts. An NLU model reads the utterance "Book a flight to Tokyo next Friday" and produces an intent, book_flight, with a confidence score of 0.92, plus entities: destination Tokyo and date next Friday. The intent maps to a set of required slots. Here destination and date are filled but origin is still empty, so the bot asks "Which city are you flying from?" and loops, re-running understanding on the answer, until every slot is filled and it can execute. A confidence gate guards the front: if the top intent scores below a threshold such as 0.6, the bot does not guess but falls back to a clarifying question. The lesson is that intent-plus-entities generalizes where brittle keyword matching fails, and every design needs a fallback and a confirmation before costly actions.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .utt{fill:#f1f5f9;stroke:#64748b;stroke-width:1.4}
    .nlu{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}
    .intent{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.3}
    .ent{fill:#ecfdf5;stroke:#10b981;stroke-width:1.3}
    .slotok{fill:#ecfdf5;stroke:#10b981;stroke-width:1.2}
    .slotno{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.3}
    .fallback{fill:#fef2f2;stroke:#ef4444;stroke-width:1.3}
    .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
    .edge{stroke:#64748b;stroke-width:1.7;fill:none}
    .loop{stroke:#f59e0b;stroke-width:1.6;fill:none;stroke-dasharray:4 3}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .utt{fill:#26262a;stroke:#9ca3af}.nlu{fill:#1e1b4b;stroke:#818cf8}.intent{fill:#1e293b;stroke:#569cd6}
      .ent{fill:#064e3b;stroke:#34d399}.slotok{fill:#064e3b;stroke:#34d399}.slotno{fill:#3a2e0a;stroke:#fbbf24}
      .fallback{fill:#3a1a1a;stroke:#f87171}.panel{fill:#26262a;stroke:#3f3f46}.edge{stroke:#9ca3af}.loop{stroke:#fbbf24}
    }
  </style>
  <defs>
    <marker id="ne-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
    <marker id="ne-l" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="410"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="408.5" rx="10"/>
  <text class="label ink h" x="24" y="30">Classify the intent, pull out the entities, then fill the missing slots</text>

  <!-- utterance -->
  <rect class="utt" x="24" y="50" width="360" height="30" rx="6"/>
  <text class="label mono ink" x="36" y="69" font-size="10.5">"Book a flight to Tokyo next Friday"</text>

  <!-- NLU -->
  <path class="edge" d="M204,80 L204,96" marker-end="url(#ne-a)"/>
  <rect class="nlu" x="24" y="98" width="180" height="46" rx="7"/>
  <text class="label ink s" x="114" y="119" text-anchor="middle" font-weight="700">NLU model</text>
  <text class="label muted s" x="114" y="135" text-anchor="middle" font-size="9.5">understand the text</text>

  <!-- intent + entities outputs -->
  <path class="edge" d="M204,112 L232,112" marker-end="url(#ne-a)"/>
  <rect class="intent" x="234" y="96" width="230" height="24" rx="5"/>
  <text class="label mono ink" x="244" y="112" font-size="9.5">intent = book_flight  (conf 0.92)</text>
  <rect class="ent" x="234" y="124" width="230" height="34" rx="5"/>
  <text class="label mono ink" x="244" y="140" font-size="9.5">destination = Tokyo</text>
  <text class="label mono ink" x="244" y="153" font-size="9.5">date = next Friday</text>

  <!-- slots panel -->
  <text class="label muted ph" x="480" y="70">Required slots for book_flight</text>
  <rect class="slotok" x="480" y="78" width="216" height="22" rx="4"/>
  <text class="label mono ink" x="490" y="93" font-size="9.5">destination: Tokyo</text>
  <text class="label green s" x="662" y="93" font-size="10" font-weight="700">&#10003;</text>
  <rect class="slotok" x="480" y="102" width="216" height="22" rx="4"/>
  <text class="label mono ink" x="490" y="117" font-size="9.5">date: next Friday</text>
  <text class="label green s" x="662" y="117" font-size="10" font-weight="700">&#10003;</text>
  <rect class="slotno" x="480" y="126" width="216" height="22" rx="4"/>
  <text class="label mono ink" x="490" y="141" font-size="9.5">origin: &#8212; missing</text>
  <text class="label amber s" x="660" y="141" font-size="9.5" font-weight="700">ask</text>

  <!-- ask + loop -->
  <rect class="slotno" x="480" y="156" width="216" height="34" rx="6"/>
  <text class="label amber s" x="490" y="173" font-weight="700">Bot asks:</text>
  <text class="label muted s" x="490" y="186" font-size="9.5">"Which city are you flying from?"</text>
  <path class="loop" d="M480,173 C430,173 420,150 460,140" marker-end="url(#ne-l)"/>
  <text class="label amber s" x="398" y="205" font-size="9">loop until every slot filled &#8594; then execute</text>

  <!-- confidence gate -->
  <rect class="fallback" x="24" y="170" width="356" height="40" rx="7"/>
  <text class="label red s" x="36" y="188" font-weight="700">Confidence gate: top intent below 0.6?</text>
  <text class="label muted s" x="36" y="204" font-size="9.5">don't guess &#8594; fall back to a clarifying question</text>

  <line class="frame" x1="24" y1="228" x2="696" y2="228" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="250">This is the core of understanding language: an <tspan class="blue" font-weight="700">intent</tspan> is what the user wants; <tspan class="green" font-weight="700">entities</tspan> are the values it needs;</text>
  <text class="label muted s" x="24" y="268"><tspan class="amber" font-weight="700">slot-filling</tspan> is the conversation that collects any values still missing. Keyword matching (&#8220;if 'flight' in text&#8221;) is brittle &#8212;</text>
  <text class="label muted s" x="24" y="286">it breaks on paraphrases and can't tell <tspan class="mono ink">Tokyo</tspan> the destination from <tspan class="mono ink">Tokyo</tspan> the origin. Intent-plus-entities generalizes.</text>
  <text class="label muted s" x="24" y="304">Two rules for every design: keep a <tspan class="ink" font-weight="700">fallback</tspan> for low confidence so the bot asks instead of guessing wrong, and</text>
  <text class="label muted s" x="24" y="322"><tspan class="ink" font-weight="700">confirm before costly or irreversible actions</tspan> (&#8220;Book LAX &#8594; Tokyo, Fri the 18th &#8212; yes?&#8221;) &#8212; a misread entity shouldn't buy a ticket.</text>
  <text class="label muted s" x="24" y="344">Modern stacks hand intent + entity extraction to an LLM, but the same discipline holds: validate the slots, then act.</text>
</svg>
