<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="bs-title bs-desc" preserveAspectRatio="xMidYMid meet">
  <title id="bs-title">BeautifulSoup parses an HTML string into a tree you can navigate or search</title>
  <desc id="bs-desc">On the left, a raw HTML string of a body containing a ul with two li items and an h2. An arrow labelled BeautifulSoup with the html.parser turns that string into the parse tree shown on the right: a root soup node, a body, a ul with two li children, and an h2. Below, two panels contrast the two ways to reach nodes in that same tree. Navigate methods such as parent, children, contents and next_sibling move one hop at a time relative to a node you already hold. Search methods such as find, find_all, select and find by id query the whole tree at once and jump straight to every match at any depth.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:11px}
    .monos{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.bluestroke{stroke:#3b82f6}
    .green{fill:#10b981}.greenstroke{stroke:#10b981}
    .amber{fill:#f59e0b}
    .node{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.3}
    .edge{stroke:#94a3b8;stroke-width:1.4;fill:none}
    .code{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1}
    .navp{fill:#ecfdf5;stroke:#10b981;stroke-width:1.4}
    .srchp{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.4}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.bluestroke{stroke:#569cd6}.green{fill:#34d399}.greenstroke{stroke:#34d399}.amber{fill:#fbbf24}
      .node{fill:#26262a;stroke:#6b7280}.edge{stroke:#6b7280}.code{fill:#26262a;stroke:#3f3f46}
      .navp{fill:#064e3b;stroke:#34d399}.srchp{fill:#1e293b;stroke:#569cd6}
    }
  </style>
  <defs>
    <marker id="bs-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="430"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="428.5" rx="10"/>
  <text class="label ink h" x="24" y="30">Parse once, then reach nodes two ways &#8212; walk the links, or query the whole tree</text>

  <!-- HTML STRING -->
  <text class="label muted ph" x="26" y="56">HTML (one big string)</text>
  <rect class="code" x="24" y="64" width="210" height="128" rx="6"/>
  <text class="label monos ink" x="34" y="82">&#60;body&#62;</text>
  <text class="label monos ink" x="46" y="98">&#60;ul&#62;</text>
  <text class="label monos ink" x="58" y="114">&#60;li&#62;Home&#60;/li&#62;</text>
  <text class="label monos ink" x="58" y="130">&#60;li&#62;News&#60;/li&#62;</text>
  <text class="label monos ink" x="46" y="146">&#60;/ul&#62;</text>
  <text class="label monos ink" x="46" y="162">&#60;h2&#62;Title&#60;/h2&#62;</text>
  <text class="label monos ink" x="34" y="178">&#60;/body&#62;</text>

  <!-- parser arrow -->
  <path class="edge" d="M238,120 L300,120" stroke-width="2" marker-end="url(#bs-a)"/>
  <text class="label mono blue" x="240" y="106">BeautifulSoup(</text>
  <text class="label mono blue" x="240" y="146">"html.parser")</text>

  <!-- PARSE TREE -->
  <text class="label muted ph" x="470" y="56">Parse tree</text>
  <path class="edge" d="M505,84 L505,100"/>
  <path class="edge" d="M488,124 L430,148"/>
  <path class="edge" d="M522,124 L590,148"/>
  <path class="edge" d="M400,172 L372,190"/>
  <path class="edge" d="M430,172 L458,190"/>
  <rect class="node" x="450" y="60" width="110" height="24" rx="5"/><text class="label mono ink" x="462" y="77">soup (root)</text>
  <rect class="node" x="472" y="100" width="66" height="24" rx="5"/><text class="label mono ink" x="486" y="117">body</text>
  <rect class="node" x="392" y="148" width="60" height="24" rx="5"/><text class="label mono green" x="406" y="165">ul</text>
  <rect class="node" x="560" y="148" width="96" height="24" rx="5"/><text class="label mono ink" x="572" y="165">h2 Title</text>
  <rect class="node" x="330" y="190" width="86" height="24" rx="5"/><text class="label mono ink" x="342" y="207">li Home</text>
  <rect class="node" x="440" y="190" width="86" height="24" rx="5"/><text class="label mono ink" x="452" y="207">li News</text>

  <line class="frame" x1="24" y1="230" x2="696" y2="230" stroke="#cbd5e1"/>

  <!-- NAVIGATE PANEL -->
  <rect class="navp" x="24" y="242" width="324" height="118" rx="8"/>
  <text class="label green ph" x="38" y="262">Navigate &#8212; hop by relationship</text>
  <text class="label mono ink" x="38" y="284">tag.parent</text>
  <text class="label mono ink" x="38" y="302">tag.contents / .children</text>
  <text class="label mono ink" x="38" y="320">tag.next_sibling</text>
  <text class="label muted s" x="38" y="344">Moves relative to a node you already hold &#8212; one</text>
  <text class="label muted s" x="38" y="356">step at a time along parent / child / sibling links.</text>

  <!-- SEARCH PANEL -->
  <rect class="srchp" x="372" y="242" width="324" height="118" rx="8"/>
  <text class="label blue ph" x="386" y="262">Search &#8212; query the whole tree</text>
  <text class="label mono ink" x="386" y="284">soup.find_all("li")</text>
  <text class="label mono ink" x="386" y="302">soup.select("ul li")</text>
  <text class="label mono ink" x="386" y="320">soup.find(id="news")</text>
  <text class="label muted s" x="386" y="344">One query hits every match at any depth &#8212; you</text>
  <text class="label muted s" x="386" y="356">need not know where in the tree a node lives.</text>

  <text class="label muted s" x="24" y="386">Navigate when you know the shape and want a neighbour; search when you want all nodes of a kind,</text>
  <text class="label muted s" x="24" y="404">wherever they sit. Both read the same tree BeautifulSoup built once from the raw HTML string.</text>
</svg>
