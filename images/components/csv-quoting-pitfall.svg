<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="csv-title csv-desc" preserveAspectRatio="xMidYMid meet">
  <title id="csv-title">Why you parse CSV with the csv module instead of splitting on commas</title>
  <desc id="csv-desc">A raw CSV row: 7, then a quoted name field Smith comma Bob, then Manager. The name is quoted because it contains a comma. On the left, splitting the line on commas produces four fields — 7, a broken quote-Smith, a stray Bob-quote, and Manager — tearing the name in two and shifting every column. On the right, the csv module's reader understands the quoting and returns three correct fields: 7, Smith comma Bob, and Manager. Quoted fields, which may also contain newlines, are why hand-splitting CSV is unsafe and the csv module exists.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:11px}
    .monos{font-family:'Consolas','SF Mono',monospace;font-size:10.5px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .rec{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.3}
    .badchip{fill:#fef2f2;stroke:#ef4444;stroke-width:1.2}
    .goodchip{fill:#ecfdf5;stroke:#10b981;stroke-width:1.2}
    .qmark{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .rec{fill:#26262a;stroke:#6b7280}.badchip{fill:#3a1a1a;stroke:#f87171}
      .goodchip{fill:#064e3b;stroke:#34d399}.qmark{fill:#3a2e0a;stroke:#fbbf24}
    }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="400"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="398.5" rx="10"/>
  <text class="label ink h" x="24" y="30">A comma inside a field is why you never split CSV by hand</text>

  <!-- raw record -->
  <text class="label muted ph" x="24" y="58">The raw row (header: id, name, role)</text>
  <rect class="rec" x="200" y="64" width="320" height="34" rx="6"/>
  <text class="label mono ink" x="216" y="86">7,<tspan class="amber" font-weight="700">"Smith, Bob"</tspan>,Manager</text>
  <rect class="qmark" x="200" y="104" width="320" height="20" rx="4"/>
  <text class="label s amber" x="212" y="118">name is quoted because it holds a comma</text>

  <line class="frame" x1="360" y1="150" x2="360" y2="330" stroke="#cbd5e1"/>

  <!-- LEFT: naive split -->
  <text class="label red ph" x="24" y="168">row.split(",")  &#8212; naive</text>
  <text class="label muted s" x="24" y="186">gives 4 fields, name torn in two:</text>
  <rect class="badchip" x="24" y="196" width="46" height="26" rx="4"/><text class="label monos ink" x="38" y="213">7</text>
  <rect class="badchip" x="76" y="196" width="86" height="26" rx="4"/><text class="label monos red" x="86" y="213">"Smith</text>
  <rect class="badchip" x="168" y="196" width="74" height="26" rx="4"/><text class="label monos red" x="178" y="213">Bob"</text>
  <rect class="badchip" x="248" y="196" width="92" height="26" rx="4"/><text class="label monos ink" x="258" y="213">Manager</text>
  <text class="label red s" x="24" y="248" font-weight="700">&#10007; 4 columns, quotes kept, everything shifts</text>
  <text class="label muted s" x="24" y="270">Every downstream row now maps to the wrong</text>
  <text class="label muted s" x="24" y="286">header &#8212; a silent corruption, not an error.</text>

  <!-- RIGHT: csv.reader -->
  <text class="label green ph" x="380" y="168">csv.reader / DictReader</text>
  <text class="label muted s" x="380" y="186">gives 3 fields, quoting understood:</text>
  <rect class="goodchip" x="380" y="196" width="46" height="26" rx="4"/><text class="label monos ink" x="394" y="213">7</text>
  <rect class="goodchip" x="432" y="196" width="140" height="26" rx="4"/><text class="label monos green" x="442" y="213">Smith, Bob</text>
  <rect class="goodchip" x="578" y="196" width="92" height="26" rx="4"/><text class="label monos ink" x="588" y="213">Manager</text>
  <text class="label green s" x="380" y="248" font-weight="700">&#10003; 3 clean fields, comma preserved inside name</text>
  <text class="label muted s" x="380" y="270">The module tracks quotes and escapes, so the</text>
  <text class="label muted s" x="380" y="286">field boundary is correct every time.</text>

  <line class="frame" x1="24" y1="346" x2="696" y2="346" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="368">Quoted fields can hold commas <tspan class="ink" font-weight="700">and newlines</tspan>, so line-by-line splitting breaks two ways. Let csv.reader (or</text>
  <text class="label muted s" x="24" y="386">pandas) handle quoting, escaping, and dialects &#8212; open files with newline="" so embedded newlines parse right.</text>
</svg>
