<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="ie-title ie-desc" preserveAspectRatio="xMidYMid meet">
  <title id="ie-title">A GUI has no API, so you drive it by injecting the same input events a human makes</title>
  <desc id="ie-desc">A real keyboard and mouse and a PyAutoGUI script both feed the very same operating-system input event queue, which delivers events to whichever window has focus, so the application cannot tell a synthesized event from a human one. High-level calls decompose into low-level events: click() becomes a mouseDown then a mouseUp; typewrite('hi') becomes keyDown and keyUp for h then for i; hotkey('ctrl','c') presses ctrl down, c down, then releases c and ctrl in reverse. The crucial difference from a real API is that these calls return nothing about success: they are fire-and-forget, so the only way to know an action worked is to observe the screen afterward. A note contrasts absolute moveTo(x,y) with relative move(dx,dy).</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .human{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.3}
    .script{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.4}
    .queue{fill:#ecfdf5;stroke:#10b981;stroke-width:1.5}
    .app{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.3}
    .evt{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}
    .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
    .edge{stroke:#64748b;stroke-width:1.7;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .human{fill:#26262a;stroke:#6b7280}.script{fill:#1e293b;stroke:#569cd6}.queue{fill:#064e3b;stroke:#34d399}
      .app{fill:#26262a;stroke:#6b7280}.evt{fill:#3a2e0a;stroke:#fbbf24}.panel{fill:#26262a;stroke:#3f3f46}.edge{stroke:#9ca3af}
    }
  </style>
  <defs>
    <marker id="ie-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="410"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="408.5" rx="10"/>
  <text class="label ink h" x="24" y="30">You don't call the app's functions &#8212; you inject the OS input events a human would make</text>

  <!-- two sources -->
  <rect class="human" x="24" y="52" width="196" height="42" rx="7"/>
  <text class="label ink s" x="36" y="70" font-weight="700">Real keyboard &amp; mouse</text>
  <text class="label muted s" x="36" y="86" font-size="10">a person types and clicks</text>

  <rect class="script" x="24" y="102" width="196" height="42" rx="7"/>
  <text class="label blue s" x="36" y="120" font-weight="700">Your PyAutoGUI script</text>
  <text class="label mono muted" x="36" y="135" font-size="9">click(); typewrite('hi')</text>

  <!-- merge into queue -->
  <path class="edge" d="M220,73 L286,90" marker-end="url(#ie-a)"/>
  <path class="edge" d="M220,123 L286,106" marker-end="url(#ie-a)"/>
  <rect class="queue" x="288" y="72" width="150" height="52" rx="7"/>
  <text class="label green s" x="300" y="90" font-weight="700">OS input event</text>
  <text class="label green s" x="300" y="104" font-weight="700">queue</text>
  <text class="label muted s" x="300" y="118" font-size="9.5">one stream for both</text>

  <path class="edge" d="M438,98 L500,98" marker-end="url(#ie-a)"/>
  <rect class="app" x="502" y="72" width="194" height="52" rx="7"/>
  <text class="label ink s" x="514" y="90" font-weight="700">The focused window</text>
  <text class="label muted s" x="514" y="106" font-size="10">receives the events and reacts &#8212;</text>
  <text class="label muted s" x="514" y="119" font-size="10">it can't tell human from script</text>

  <!-- event decomposition -->
  <text class="label muted ph" x="24" y="172">Every high-level call is really a burst of low-level events</text>
  <rect class="evt" x="24" y="182" width="215" height="52" rx="6"/>
  <text class="label mono ink" x="34" y="200" font-size="10.5" font-weight="700">click()</text>
  <text class="label mono muted" x="34" y="216" font-size="9.5">mouseDown &#8594; mouseUp</text>
  <text class="label muted s" x="34" y="230" font-size="9.5">at the current cursor pixel</text>

  <rect class="evt" x="248" y="182" width="215" height="52" rx="6"/>
  <text class="label mono ink" x="258" y="200" font-size="10.5" font-weight="700">typewrite('hi')</text>
  <text class="label mono muted" x="258" y="216" font-size="9.5">down h &#8594; up h &#8594; down i &#8594; up i</text>
  <text class="label muted s" x="258" y="230" font-size="9.5">one key press = two events</text>

  <rect class="evt" x="472" y="182" width="224" height="52" rx="6"/>
  <text class="label mono ink" x="482" y="200" font-size="10.5" font-weight="700">hotkey('ctrl','c')</text>
  <text class="label mono muted" x="482" y="216" font-size="9.5">down ctrl &#8594; down c &#8594; up c &#8594; up ctrl</text>
  <text class="label muted s" x="482" y="230" font-size="9.5">release order is reversed</text>

  <line class="frame" x1="24" y1="256" x2="696" y2="256" stroke="#cbd5e1"/>
  <!-- no return value panel -->
  <rect class="panel" x="24" y="270" width="332" height="86" rx="7"/>
  <text class="label red ph" x="36" y="290">No return value &#8212; fire and forget</text>
  <text class="label muted s" x="36" y="308">A real API call returns whether it worked. An input</text>
  <text class="label muted s" x="36" y="324">event returns nothing &#8212; the key may land in the wrong</text>
  <text class="label muted s" x="36" y="340">field. The only proof is to <tspan class="ink" font-weight="700">look at the screen after</tspan>.</text>

  <rect class="panel" x="364" y="270" width="332" height="86" rx="7"/>
  <text class="label blue ph" x="376" y="290">Absolute vs relative motion</text>
  <text class="label mono muted" x="376" y="308" font-size="9.5">moveTo(x, y)</text>
  <text class="label muted s" x="470" y="308">jump to a fixed screen pixel</text>
  <text class="label mono muted" x="376" y="326" font-size="9.5">move(dx, dy)</text>
  <text class="label muted s" x="470" y="326">nudge from where the cursor is now</text>
  <text class="label muted s" x="376" y="346" font-size="10">relative motion survives a moved window; absolute doesn't</text>

  <text class="label muted s" x="24" y="378">Because the app is just reacting to raw events, automation and a human are indistinguishable &#8212; powerful, but</text>
  <text class="label muted s" x="24" y="396">unforgiving: there is no handshake, so you must verify each step by observing the result, not by trusting the call.</text>
</svg>
