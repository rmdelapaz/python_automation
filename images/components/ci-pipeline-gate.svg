<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="ci-title ci-desc" preserveAspectRatio="xMidYMid meet">
  <title id="ci-title">Continuous integration runs on every push and gates the merge</title>
  <desc id="ci-desc">How continuous integration works as a gate. A developer pushes a commit or opens a pull request, which automatically triggers the CI pipeline. The pipeline runs stages in order and fails fast: checkout, install dependencies, lint, run tests across a matrix of Python versions 3.10, 3.11 and 3.12, then build. If every stage is green, the status check passes and the merge is allowed. If any stage is red, the merge is blocked and the author is notified. A footer explains the point: CI runs automatically on every change, gives fast feedback, blocks broken code from merging, tests a matrix of versions, and keeps the main branch always green.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .dev{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.3}
    .stage{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
    .matrix{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.3}
    .pass{fill:#ecfdf5;stroke:#10b981;stroke-width:1.5}
    .fail{fill:#fef2f2;stroke:#ef4444;stroke-width:1.5}
    .edge{stroke:#64748b;stroke-width:1.7;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .dev{fill:#1e293b;stroke:#569cd6}.stage{fill:#26262a;stroke:#6b7280}.matrix{fill:#3a2e0a;stroke:#fbbf24}
      .pass{fill:#064e3b;stroke:#34d399}.fail{fill:#3a1a1a;stroke:#f87171}.edge{stroke:#9ca3af}
    }
  </style>
  <defs>
    <marker id="ci-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="410"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="408.5" rx="10"/>
  <text class="label ink h" x="24" y="30">CI runs on every push and stands between broken code and main</text>

  <!-- trigger -->
  <rect class="dev" x="24" y="54" width="150" height="48" rx="7"/>
  <text class="label blue s" x="36" y="72" font-weight="700">push / open PR</text>
  <text class="label mono muted" x="36" y="90" font-size="9">any commit triggers CI</text>
  <path class="edge" d="M174,78 L206,78" marker-end="url(#ci-a)"/>
  <text class="label s muted" x="176" y="72">auto</text>

  <!-- stages -->
  <text class="label muted ph" x="212" y="50">Pipeline &#8212; stages run in order, fail fast</text>
  <rect class="stage" x="206" y="54" width="86" height="48" rx="6"/><text class="label mono ink" x="249" y="76" text-anchor="middle" font-size="9">checkout</text>
  <path class="edge" d="M292,78 L304,78" marker-end="url(#ci-a)"/>
  <rect class="stage" x="304" y="54" width="86" height="48" rx="6"/><text class="label mono ink" x="347" y="76" text-anchor="middle" font-size="9">install</text>
  <path class="edge" d="M390,78 L402,78" marker-end="url(#ci-a)"/>
  <rect class="stage" x="402" y="54" width="72" height="48" rx="6"/><text class="label mono ink" x="438" y="76" text-anchor="middle" font-size="9">lint</text>
  <path class="edge" d="M474,78 L486,78" marker-end="url(#ci-a)"/>
  <rect class="matrix" x="486" y="54" width="100" height="48" rx="6"/><text class="label mono ink" x="536" y="72" text-anchor="middle" font-size="9" font-weight="700">test</text><text class="label muted" x="536" y="86" text-anchor="middle" font-size="8">3.10/3.11/3.12</text>
  <path class="edge" d="M586,78 L598,78" marker-end="url(#ci-a)"/>
  <rect class="stage" x="598" y="54" width="86" height="48" rx="6"/><text class="label mono ink" x="641" y="76" text-anchor="middle" font-size="9">build</text>

  <text class="label muted s" x="206" y="124">the test stage runs a <tspan class="ink" font-weight="700">matrix</tspan> &#8212; the same suite on each Python version, in parallel.</text>

  <!-- outcomes -->
  <path class="edge" d="M347,138 L300,168" marker-end="url(#ci-a)"/>
  <path class="edge" d="M480,138 L520,168" marker-end="url(#ci-a)"/>

  <rect class="pass" x="120" y="172" width="270" height="58" rx="8"/>
  <text class="label green ph" x="134" y="192">&#10003; all green</text>
  <text class="label ink s" x="134" y="210">status check passes &#8594; merge allowed</text>
  <text class="label muted s" x="134" y="224" font-size="10">reviewers see a green check; main stays deployable</text>

  <rect class="fail" x="410" y="172" width="286" height="58" rx="8"/>
  <text class="label red ph" x="424" y="192">&#10007; any stage red</text>
  <text class="label ink s" x="424" y="210">merge blocked &#183; author notified</text>
  <text class="label muted s" x="424" y="224" font-size="10">fail fast: later stages skip; fix and push again</text>

  <line class="frame" x1="24" y1="252" x2="696" y2="252" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="274">Continuous integration means every change is <tspan class="ink" font-weight="700">automatically built and tested</tspan> the moment it's pushed, and a</text>
  <text class="label muted s" x="24" y="292">required status check <tspan class="ink" font-weight="700">blocks the merge</tspan> until it's green. That's what keeps <tspan class="ink" font-weight="700">main</tspan> always releasable &#8212; nobody merges red.</text>
  <text class="label muted s" x="24" y="318">Fail fast so feedback is quick; cache dependencies to keep runs short; a slow pipeline is one people route around.</text>
  <text class="label muted s" x="24" y="344">The matrix guards compatibility &#8212; a change that breaks on 3.10 but passes on 3.12 is caught before merge, not in prod.</text>
  <text class="label muted s" x="24" y="370">Config lives in the repo (GitHub Actions .github/workflows, GitLab CI .gitlab-ci.yml) so the pipeline is versioned with</text>
  <text class="label muted s" x="24" y="388">the code it tests &#8212; branch protection makes the passing check mandatory before merge.</text>
</svg>
