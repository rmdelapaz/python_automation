<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="dg-title dg-desc" preserveAspectRatio="xMidYMid meet">
  <title id="dg-title">A Discord bot listens on a persistent gateway and only hears the events its Intents declare</title>
  <desc id="dg-desc">A Discord bot connects to the Discord gateway over a single long-lived WebSocket that stays open, so events are pushed in real time rather than polled with REST calls. But you only receive the event types you subscribe to through Intents. GUILD_MESSAGES and the privileged MESSAGE_CONTENT intent are enabled here, while MEMBERS and PRESENCES are left off. The classic gotcha: MESSAGE CONTENT is a privileged intent, so if it is not enabled both in the developer portal and in code, your on_message handler still fires but message.content is empty, which looks like the bot ignoring every command. The fix is to enable it in both places and, following least privilege, request only the intents your bot actually needs.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .gw{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}
    .bot{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.4}
    .gate{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.3}
    .on{fill:#ecfdf5;stroke:#10b981;stroke-width:1.3}
    .off{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1.2}
    .warn{fill:#fef2f2;stroke:#ef4444;stroke-width:1.4}
    .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
    .edge{stroke:#64748b;stroke-width:1.7;fill:none}
    .ws{stroke:#6366f1;stroke-width:2;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .gw{fill:#1e1b4b;stroke:#818cf8}.bot{fill:#1e293b;stroke:#569cd6}.gate{fill:#26262a;stroke:#6b7280}
      .on{fill:#064e3b;stroke:#34d399}.off{fill:#26262a;stroke:#3f3f46}.warn{fill:#3a1a1a;stroke:#f87171}
      .panel{fill:#26262a;stroke:#3f3f46}.edge{stroke:#9ca3af}.ws{stroke:#818cf8}
    }
  </style>
  <defs>
    <marker id="dg-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
    <marker id="dg-w" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="410"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="408.5" rx="10"/>
  <text class="label ink h" x="24" y="30">One long-lived gateway pushes events &#8212; but only the Intents you declare</text>

  <!-- gateway + bot over persistent WS -->
  <rect class="gw" x="24" y="58" width="150" height="60" rx="8"/>
  <text class="label ink s" x="99" y="82" text-anchor="middle" font-weight="700">Discord Gateway</text>
  <text class="label muted s" x="99" y="99" text-anchor="middle" font-size="9.5">servers &amp; events</text>
  <text class="label muted s" x="99" y="111" text-anchor="middle" font-size="9.5">live source</text>

  <path class="ws" d="M174,80 L232,80" marker-end="url(#dg-w)" marker-start="url(#dg-w)"/>
  <text class="label" x="203" y="72" text-anchor="middle" font-size="9" fill="#6366f1" font-weight="700">WebSocket</text>
  <text class="label muted s" x="203" y="98" text-anchor="middle" font-size="8.5">stays open</text>

  <rect class="bot" x="232" y="58" width="150" height="60" rx="8"/>
  <text class="label blue s" x="307" y="82" text-anchor="middle" font-weight="700">Your bot client</text>
  <text class="label muted s" x="307" y="99" text-anchor="middle" font-size="9.5">events pushed in,</text>
  <text class="label muted s" x="307" y="111" text-anchor="middle" font-size="9.5">not polled (vs REST)</text>

  <!-- intents gate -->
  <text class="label muted ph" x="410" y="54">Intents gate &#8212; only what you subscribe to</text>
  <rect class="on" x="410" y="60" width="286" height="24" rx="4"/>
  <text class="label mono ink" x="420" y="76" font-size="9.5">GUILD_MESSAGES</text>
  <text class="label green s" x="640" y="76" font-size="9.5" font-weight="700">ON</text>
  <rect class="on" x="410" y="88" width="286" height="24" rx="4"/>
  <text class="label mono ink" x="420" y="104" font-size="9.5">MESSAGE_CONTENT (privileged)</text>
  <text class="label green s" x="640" y="104" font-size="9.5" font-weight="700">ON</text>
  <rect class="off" x="410" y="116" width="286" height="24" rx="4"/>
  <text class="label mono muted" x="420" y="132" font-size="9.5">GUILD_MEMBERS (privileged)</text>
  <text class="label muted s" x="638" y="132" font-size="9.5" font-weight="700">OFF</text>
  <rect class="off" x="410" y="144" width="286" height="24" rx="4"/>
  <text class="label mono muted" x="420" y="160" font-size="9.5">PRESENCES (privileged)</text>
  <text class="label muted s" x="638" y="160" font-size="9.5" font-weight="700">OFF</text>

  <!-- events flow into handlers -->
  <path class="edge" d="M307,118 L307,150" marker-end="url(#dg-a)"/>
  <rect class="gate" x="232" y="152" width="150" height="40" rx="6"/>
  <text class="label mono ink" x="307" y="170" text-anchor="middle" font-size="9.5">@bot.event</text>
  <text class="label mono ink" x="307" y="184" text-anchor="middle" font-size="9.5">on_message(msg)</text>

  <!-- gotcha -->
  <rect class="warn" x="24" y="206" width="672" height="60" rx="7"/>
  <text class="label red ph" x="36" y="226">The #1 &#8220;my bot ignores every command&#8221; bug</text>
  <text class="label muted s" x="36" y="245">MESSAGE CONTENT is a <tspan class="ink" font-weight="700">privileged</tspan> intent. If it isn't enabled in <tspan class="ink" font-weight="700">both</tspan> the Developer Portal and your code,</text>
  <text class="label muted s" x="36" y="261"><tspan class="mono ink">on_message</tspan> still fires &#8212; but <tspan class="mono ink">message.content</tspan> comes through <tspan class="red" font-weight="700">empty</tspan>, so every command silently fails to match.</text>

  <line class="frame" x1="24" y1="284" x2="696" y2="284" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="306">Discord's gateway is a persistent connection, so your bot must stay running to hear events &#8212; unlike a webhook that</text>
  <text class="label muted s" x="24" y="324">wakes on demand. Declare intents explicitly and follow <tspan class="ink" font-weight="700">least privilege</tspan>: request only what you use, since privileged</text>
  <text class="label muted s" x="24" y="342">intents need portal approval (and verification once your bot is in many servers). Organize handlers into <tspan class="ink" font-weight="700">cogs</tspan> &#8212;</text>
  <text class="label muted s" x="24" y="360">modular extension classes &#8212; so a large bot's events, commands, and state stay separated instead of one giant file.</text>
</svg>
