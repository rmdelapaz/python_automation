<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="lg-title lg-desc" preserveAspectRatio="xMidYMid meet">
  <title id="lg-title">Log analysis turns unstructured lines into structured records you can aggregate</title>
  <desc id="lg-desc">The log analysis pipeline. A raw access-log line — an IP, a timestamp, a request method and path, a status code and a byte count — is matched by a regular expression with named groups that extracts fields into a structured record with keys ip, time, method, path, status and bytes. Once each line is a record, you aggregate: a Counter of status codes gives 200 seen 8412 times and 500 seen 143 times, and you can find the top paths or compute an error rate over time. A footer notes that emitting structured logs, such as JSON, at the source removes the need to parse, because each line loads directly with json.loads.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .monos{font-family:'Consolas','SF Mono',monospace;font-size:9px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .raw{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
    .rx{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.3}
    .rec{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.3}
    .agg{fill:#ecfdf5;stroke:#10b981;stroke-width:1.3}
    .edge{stroke:#64748b;stroke-width:1.7;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .raw{fill:#26262a;stroke:#6b7280}.rx{fill:#3a2e0a;stroke:#fbbf24}.rec{fill:#1e293b;stroke:#569cd6}.agg{fill:#064e3b;stroke:#34d399}
      .edge{stroke:#9ca3af}
    }
  </style>
  <defs>
    <marker id="lg-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="400"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="398.5" rx="10"/>
  <text class="label ink h" x="24" y="30">Logs are text until you parse them &#8212; extract fields, then aggregate</text>

  <!-- raw line -->
  <text class="label muted ph" x="24" y="56">1 &#183; Raw log line (text)</text>
  <rect class="raw" x="24" y="64" width="672" height="34" rx="6"/>
  <text class="label monos ink" x="34" y="85"><tspan class="blue">192.168.1.5</tspan> - - [<tspan class="muted">10/Oct/2024:13:55:36</tspan>] "<tspan class="amber">GET</tspan> <tspan class="amber">/api/orders</tspan> HTTP/1.1" <tspan class="red">500</tspan> <tspan class="muted">1234</tspan></text>

  <path class="edge" d="M360,98 L360,116" marker-end="url(#lg-a)"/>
  <text class="label s muted" x="368" y="112">regex with named groups extracts fields</text>

  <!-- regex + record -->
  <rect class="rx" x="24" y="120" width="330" height="70" rx="7"/>
  <text class="label amber s" x="36" y="138" font-weight="700">2 &#183; Pattern</text>
  <text class="label monos ink" x="36" y="156">(?P&#60;ip&#62;\S+) &#8230; "(?P&#60;method&#62;\w+) </text>
  <text class="label monos ink" x="36" y="170">(?P&#60;path&#62;\S+).*?" (?P&#60;status&#62;\d+)</text>
  <text class="label muted s" x="36" y="185">one regex per log format</text>
  <path class="edge" d="M354,155 L386,155" marker-end="url(#lg-a)"/>

  <rect class="rec" x="386" y="120" width="310" height="70" rx="7"/>
  <text class="label blue s" x="398" y="138" font-weight="700">3 &#183; Structured record</text>
  <text class="label monos ink" x="398" y="156">{ip:"192.168.1.5", method:"GET",</text>
  <text class="label monos ink" x="398" y="170"> path:"/api/orders", status:500,</text>
  <text class="label monos ink" x="398" y="184"> bytes:1234}</text>

  <path class="edge" d="M541,190 L541,208" marker-end="url(#lg-a)"/>
  <text class="label s muted" x="549" y="204">now: count, group &amp; trend</text>

  <!-- aggregate -->
  <rect class="agg" x="24" y="212" width="672" height="76" rx="7"/>
  <text class="label green s" x="38" y="230" font-weight="700">4 &#183; Aggregate the records</text>
  <text class="label mono ink" x="38" y="250">Counter(r["status"] for r in records)  &#8594;  {200: 8412, 404: 271, 500: 143}</text>
  <text class="label mono ink" x="38" y="268">top paths &#183; errors-per-minute &#183; bytes by client  &#8594;  alerts &amp; reports</text>
  <text class="label muted s" x="38" y="283" font-size="10">collections.Counter / defaultdict do the grouping; pandas if it's big</text>

  <line class="frame" x1="24" y1="304" x2="696" y2="304" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="326">The whole job is a funnel: many lines of <tspan class="ink" font-weight="700">text</tspan> &#8594; one <tspan class="ink" font-weight="700">record</tspan> per line &#8594; a handful of <tspan class="ink" font-weight="700">numbers</tspan> that answer a question</text>
  <text class="label muted s" x="24" y="344">("how many 500s in the last hour?"). Stream line-by-line so a multi-GB log never has to fit in memory.</text>
  <text class="label muted s" x="24" y="370">Better still: emit <tspan class="ink" font-weight="700">structured logs (JSON)</tspan> at the source &#8212; then each line is <tspan class="ink" font-weight="700">json.loads(line)</tspan>, and there's no fragile regex to maintain.</text>
</svg>
