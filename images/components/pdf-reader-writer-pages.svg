<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="pdf-title pdf-desc" preserveAspectRatio="xMidYMid meet">
  <title id="pdf-title">PDF editing moves page objects from readers into a writer, then writes once</title>
  <desc id="pdf-desc">Two source PDFs are opened as readers: report.pdf with three pages and cover.pdf with one page. Merging and splitting are the same operation: you pick page objects and add them to a PdfWriter. Here the writer collects cover page 1, then report pages 1 and 3, optionally rotating a page, and finally writer.write produces output.pdf. A note explains that pages are objects you copy between a reader and a writer, and a caveat warns that extracted text is approximate because PDFs store positioned glyphs rather than clean paragraphs.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .reader{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.3}
    .writer{fill:#ecfdf5;stroke:#10b981;stroke-width:1.5}
    .page{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
    .pagepick{fill:#fef3c7;stroke:#f59e0b;stroke-width:1.4}
    .edge{stroke:#f59e0b;stroke-width:1.6;fill:none}
    .warn{fill:#fef2f2;stroke:#ef4444;stroke-width:1.2}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .reader{fill:#1e293b;stroke:#569cd6}.writer{fill:#064e3b;stroke:#34d399}
      .page{fill:#26262a;stroke:#6b7280}.pagepick{fill:#4a3a0a;stroke:#fbbf24}
      .edge{stroke:#fbbf24}.warn{fill:#3a1a1a;stroke:#f87171}
    }
  </style>
  <defs>
    <marker id="pdf-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="400"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="398.5" rx="10"/>
  <text class="label ink h" x="24" y="30">Merge, split, rotate: all just move page objects into a writer</text>

  <!-- READERS -->
  <text class="label blue ph" x="30" y="58">PdfReader(&#8230;)</text>
  <rect class="reader" x="24" y="66" width="150" height="96" rx="8"/>
  <text class="label mono blue" x="36" y="84">report.pdf</text>
  <rect class="pagepick" x="34" y="92" width="40" height="56" rx="4"/><text class="label mono ink" x="54" y="124" text-anchor="middle">1</text>
  <rect class="page" x="80" y="92" width="40" height="56" rx="4"/><text class="label mono muted" x="100" y="124" text-anchor="middle">2</text>
  <rect class="pagepick" x="126" y="92" width="40" height="56" rx="4"/><text class="label mono ink" x="146" y="124" text-anchor="middle">3</text>

  <rect class="reader" x="24" y="180" width="150" height="96" rx="8"/>
  <text class="label mono blue" x="36" y="198">cover.pdf</text>
  <rect class="pagepick" x="34" y="206" width="40" height="56" rx="4"/><text class="label mono ink" x="54" y="238" text-anchor="middle">1</text>
  <text class="label muted s" x="82" y="238">one page</text>

  <!-- arrows to writer -->
  <path class="edge" d="M166,236 C300,236 300,120 372,108" marker-end="url(#pdf-a)"/>
  <path class="edge" d="M170,120 C300,120 320,150 372,150" marker-end="url(#pdf-a)"/>
  <path class="edge" d="M170,120 C300,90 320,190 372,196" marker-end="url(#pdf-a)"/>
  <text class="label amber s" x="240" y="96" font-weight="700">writer.add_page(page)</text>

  <!-- WRITER -->
  <text class="label green ph" x="380" y="58">PdfWriter()</text>
  <rect class="writer" x="374" y="66" width="200" height="180" rx="8"/>
  <rect class="page" x="388" y="92" width="46" height="60" rx="4"/><text class="label mono ink" x="411" y="118" text-anchor="middle">cover</text><text class="label mono muted" x="411" y="134" text-anchor="middle">p1</text>
  <rect class="page" x="444" y="92" width="46" height="60" rx="4"/><text class="label mono ink" x="467" y="118" text-anchor="middle">rpt</text><text class="label mono muted" x="467" y="134" text-anchor="middle">p1</text>
  <rect class="page" x="500" y="92" width="46" height="60" rx="4"/><text class="label mono ink" x="523" y="118" text-anchor="middle">rpt</text><text class="label mono muted" x="523" y="134" text-anchor="middle">p3</text>
  <text class="label amber s" x="388" y="180">rotate: page.rotate(90) before adding</text>
  <text class="label mono ink" x="388" y="206">with open("out.pdf","wb") as f:</text>
  <text class="label mono ink" x="388" y="224">    writer.write(f)</text>
  <text class="label green s" x="388" y="240" font-weight="700">&#8595; one output PDF</text>

  <!-- OUTPUT + caveat -->
  <path class="edge" d="M474,246 L474,262" marker-end="url(#pdf-a)"/>
  <rect class="writer" x="404" y="264" width="140" height="30" rx="6"/><text class="label mono green" x="418" y="284">output.pdf  (3 pages)</text>

  <rect class="warn" x="592" y="66" width="104" height="180" rx="8"/>
  <text class="label red s" x="604" y="86" font-weight="700">Text caveat</text>
  <text class="label muted s" x="604" y="106">PDFs store</text>
  <text class="label muted s" x="604" y="120">glyphs at x/y</text>
  <text class="label muted s" x="604" y="134">positions, not</text>
  <text class="label muted s" x="604" y="148">paragraphs.</text>
  <text class="label muted s" x="604" y="168">extract_text()</text>
  <text class="label muted s" x="604" y="182">is approximate</text>
  <text class="label muted s" x="604" y="196">&#8212; order &amp; spaces</text>
  <text class="label muted s" x="604" y="210">may be off.</text>
  <text class="label muted s" x="604" y="230">Scans need</text>
  <text class="label muted s" x="604" y="244">OCR.</text>

  <line class="frame" x1="24" y1="316" x2="696" y2="316" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="338">A PDF is a sequence of page objects. Merging, splitting, reordering, and rotating are all the same move: pull</text>
  <text class="label muted s" x="24" y="356">the pages you want from one or more PdfReaders into a PdfWriter, then write() once to a new file.</text>
  <text class="label muted s" x="24" y="382">Reading is the hard direction &#8212; treat extracted text as a best-effort guess and validate before trusting it.</text>
</svg>
