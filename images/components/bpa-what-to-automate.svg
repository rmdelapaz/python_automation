<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="bp-title bp-desc" preserveAspectRatio="xMidYMid meet">
  <title id="bp-title">Business process automation: map it first, then automate the right steps and escalate exceptions</title>
  <desc id="bp-desc">Automating a business process starts by mapping it, then automating the right steps rather than everything. A request comes in and rule-based checks run automatically. A decision asks whether this is a standard case: if yes, it flows straight through automated steps to done; if it is an exception or needs judgment, it is routed to a human reviewer, who resolves it and returns it to the flow. A panel classifies tasks: automate the high-volume, rule-based, stable, and structured steps, but keep humans for judgment, empathy, rare edge cases, and unstructured exceptions. The footer stresses two disciplines: simplify the process before automating it, because automating a broken process just makes the mess faster, and design the happy path for straight-through processing while always giving exceptions a clean path to a person.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .start{fill:#f1f5f9;stroke:#64748b;stroke-width:1.4}
    .auto{fill:#ecfdf5;stroke:#10b981;stroke-width:1.3}
    .dia{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}
    .human{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.4}
    .done{fill:#ecfdf5;stroke:#10b981;stroke-width:1.4}
    .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
    .edge{stroke:#64748b;stroke-width:1.7;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .start{fill:#26262a;stroke:#9ca3af}.auto{fill:#064e3b;stroke:#34d399}.dia{fill:#1e293b;stroke:#569cd6}
      .human{fill:#3a2e0a;stroke:#fbbf24}.done{fill:#064e3b;stroke:#34d399}.panel{fill:#26262a;stroke:#3f3f46}.edge{stroke:#9ca3af}
    }
  </style>
  <defs>
    <marker id="bp-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="410"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="408.5" rx="10"/>
  <text class="label ink h" x="24" y="30">Don't automate everything &#8212; automate the happy path, escalate exceptions</text>

  <!-- flow -->
  <rect class="start" x="24" y="58" width="120" height="44" rx="7"/>
  <text class="label ink s" x="84" y="76" text-anchor="middle" font-weight="700">Request in</text>
  <text class="label muted s" x="84" y="91" text-anchor="middle" font-size="9">e.g. an invoice</text>

  <path class="edge" d="M144,80 L168,80" marker-end="url(#bp-a)"/>
  <rect class="auto" x="170" y="58" width="120" height="44" rx="7"/>
  <text class="label green s" x="230" y="76" text-anchor="middle" font-weight="700">Rule checks</text>
  <text class="label muted s" x="230" y="91" text-anchor="middle" font-size="9">automated</text>

  <path class="edge" d="M290,80 L318,80" marker-end="url(#bp-a)"/>
  <polygon class="dia" points="400,52 476,80 400,108 324,80"/>
  <text class="label blue s" x="400" y="77" text-anchor="middle" font-weight="700">Standard</text>
  <text class="label blue s" x="400" y="90" text-anchor="middle" font-weight="700">case?</text>

  <!-- yes: straight through -->
  <path class="edge" d="M476,80 L512,80" marker-end="url(#bp-a)"/>
  <text class="label green s" x="490" y="74" font-size="9" font-weight="700">yes</text>
  <rect class="auto" x="514" y="58" width="182" height="44" rx="7"/>
  <text class="label green s" x="605" y="76" text-anchor="middle" font-weight="700">Straight-through &#8594; Done</text>
  <text class="label muted s" x="605" y="91" text-anchor="middle" font-size="9">automated end to end, no human</text>

  <!-- no: human -->
  <path class="edge" d="M400,108 L400,132" marker-end="url(#bp-a)"/>
  <text class="label amber s" x="408" y="124" font-size="9" font-weight="700">exception / judgment</text>
  <rect class="human" x="300" y="134" width="200" height="44" rx="7"/>
  <text class="label amber s" x="400" y="152" text-anchor="middle" font-weight="700">Human review</text>
  <text class="label muted s" x="400" y="167" text-anchor="middle" font-size="9">resolve, then return to the flow</text>
  <path class="edge" d="M500,150 C540,150 560,120 560,104" marker-end="url(#bp-a)"/>

  <!-- classification panel -->
  <rect class="panel" x="24" y="196" width="330" height="70" rx="7"/>
  <text class="label green s" x="36" y="215" font-weight="700">Automate these</text>
  <text class="label muted s" x="36" y="233" font-size="10.5">high-volume &#183; rule-based &#183; repetitive</text>
  <text class="label muted s" x="36" y="249" font-size="10.5">stable &#183; structured input</text>
  <text class="label muted s" x="36" y="262" font-size="9.5">predictable = a bot does it faster and 24/7</text>

  <rect class="panel" x="366" y="196" width="330" height="70" rx="7"/>
  <text class="label amber s" x="378" y="215" font-weight="700">Keep humans for these</text>
  <text class="label muted s" x="378" y="233" font-size="10.5">judgment &#183; empathy &#183; negotiation</text>
  <text class="label muted s" x="378" y="249" font-size="10.5">rare edge cases &#183; unstructured exceptions</text>
  <text class="label muted s" x="378" y="262" font-size="9.5">low-volume + high-variation = not worth automating</text>

  <line class="frame" x1="24" y1="286" x2="696" y2="286" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="308">Two disciplines separate real BPA from &#8220;RPA sprinkled on chaos.&#8221; First, <tspan class="ink" font-weight="700">simplify the process before you automate it</tspan></text>
  <text class="label muted s" x="24" y="326">&#8212; automating a broken process just makes the mess run faster; map it, remove redundant steps, then automate.</text>
  <text class="label muted s" x="24" y="344">Second, design for <tspan class="ink" font-weight="700">straight-through processing</tspan> on the common case, but always give exceptions a clean path to a</text>
  <text class="label muted s" x="24" y="362">person &#8212; the goal isn't zero humans, it's humans spending their time only where judgment actually adds value.</text>
</svg>
