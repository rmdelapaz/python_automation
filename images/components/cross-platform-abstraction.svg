<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="cp-title cp-desc" preserveAspectRatio="xMidYMid meet">
  <title id="cp-title">One automation, three operating systems: hide the differences behind a platform layer</title>
  <desc id="cp-desc">The same automation logic must run on Windows, macOS, and Linux, but each OS differs in ways that silently break a naive script. On Windows the copy hotkey is Ctrl+C, scaling is usually 100 percent, no permission is needed, and the backend is the Win32 API. On macOS the hotkey is Cmd+C, a Retina display doubles coordinates, and the app must be granted Accessibility permission in System Settings before any input works, using the Quartz backend. On Linux the hotkey is Ctrl+C, DPI varies by desktop, X11 allows synthetic input while Wayland largely blocks it, using an Xlib or AT-SPI backend. The lesson is to keep your logic OS-agnostic and route these differences through one thin platform layer that dispatches on sys.platform, then test on every target OS.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .logic{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}
    .layer{fill:#ecfdf5;stroke:#10b981;stroke-width:1.5}
    .win{fill:#f8fafc;stroke:#3b82f6;stroke-width:1.3}
    .mac{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.3}
    .lin{fill:#f8fafc;stroke:#f59e0b;stroke-width:1.3}
    .edge{stroke:#64748b;stroke-width:1.7;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .logic{fill:#1e293b;stroke:#569cd6}.layer{fill:#064e3b;stroke:#34d399}
      .win{fill:#26262a;stroke:#569cd6}.mac{fill:#26262a;stroke:#6b7280}.lin{fill:#26262a;stroke:#fbbf24}
      .edge{stroke:#9ca3af}
    }
  </style>
  <defs>
    <marker id="cp-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="410"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="408.5" rx="10"/>
  <text class="label ink h" x="24" y="30">One script, three operating systems &#8212; the same call, different rules underneath</text>

  <!-- logic box -->
  <rect class="logic" x="180" y="46" width="360" height="34" rx="7"/>
  <text class="label blue s" x="196" y="67" font-weight="700">Your automation logic &#8212; written once, OS-agnostic</text>

  <path class="edge" d="M360,80 L360,96" marker-end="url(#cp-a)"/>

  <!-- platform layer -->
  <rect class="layer" x="180" y="98" width="360" height="34" rx="7"/>
  <text class="label green s" x="196" y="119" font-weight="700">Platform layer &#8212; dispatch on sys.platform</text>

  <!-- fan to 3 -->
  <path class="edge" d="M300,132 L150,158" marker-end="url(#cp-a)"/>
  <path class="edge" d="M360,132 L360,158" marker-end="url(#cp-a)"/>
  <path class="edge" d="M420,132 L570,158" marker-end="url(#cp-a)"/>

  <!-- three OS columns -->
  <rect class="win" x="24" y="160" width="216" height="118" rx="7"/>
  <text class="label blue ph" x="36" y="180">Windows</text>
  <text class="label muted s" x="36" y="200">Hotkey: <tspan class="mono ink">Ctrl + C</tspan></text>
  <text class="label muted s" x="36" y="218">Scaling: usually 100%</text>
  <text class="label muted s" x="36" y="236">Permission: none needed</text>
  <text class="label muted s" x="36" y="254">Backend: <tspan class="ink">Win32 API</tspan></text>
  <text class="label muted s" x="36" y="272" font-size="9.5">key names: 'ctrl', 'alt', 'win'</text>

  <rect class="mac" x="252" y="160" width="216" height="118" rx="7"/>
  <text class="label ink ph" x="264" y="180">macOS</text>
  <text class="label muted s" x="264" y="200">Hotkey: <tspan class="mono ink">Cmd + C</tspan></text>
  <text class="label muted s" x="264" y="218">Scaling: Retina doubles coords</text>
  <text class="label red s" x="264" y="236" font-weight="700">Grant Accessibility first</text>
  <text class="label muted s" x="264" y="254">Backend: <tspan class="ink">Quartz</tspan></text>
  <text class="label muted s" x="264" y="272" font-size="9.5">key names: 'command', 'option'</text>

  <rect class="lin" x="480" y="160" width="216" height="118" rx="7"/>
  <text class="label amber ph" x="492" y="180">Linux</text>
  <text class="label muted s" x="492" y="200">Hotkey: <tspan class="mono ink">Ctrl + C</tspan></text>
  <text class="label muted s" x="492" y="218">Scaling: varies by desktop</text>
  <text class="label red s" x="492" y="236" font-weight="700">X11 works, Wayland blocks</text>
  <text class="label muted s" x="492" y="254">Backend: <tspan class="ink">Xlib / AT-SPI</tspan></text>
  <text class="label muted s" x="492" y="272" font-size="9.5">synthetic input often restricted</text>

  <line class="frame" x1="24" y1="298" x2="696" y2="298" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="320">A script that works on your machine can silently fail on another: the Cmd/Ctrl key flips, Retina doubles every</text>
  <text class="label muted s" x="24" y="338">coordinate, and macOS refuses all input until the app is granted Accessibility &#8212; no error, it just does nothing.</text>
  <text class="label muted s" x="24" y="360">Keep the differences in <tspan class="green" font-weight="700">one thin platform layer</tspan> so the rest of your code stays clean, branch on <tspan class="mono ink">sys.platform</tspan>,</text>
  <text class="label muted s" x="24" y="382">and <tspan class="ink" font-weight="700">test on every target OS</tspan> &#8212; you cannot infer macOS behavior from a Windows run. "Cross-platform" is earned, not assumed.</text>
</svg>
