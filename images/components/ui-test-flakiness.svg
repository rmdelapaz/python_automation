<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="fl-title fl-desc" preserveAspectRatio="xMidYMid meet">
  <title id="fl-title">Why UI tests go flaky and how to stabilize them</title>
  <desc id="fl-desc">The four common sources of UI and end-to-end test flakiness, each paired with a fix. Timing, from asynchronous rendering and network latency, is fixed with explicit waits for a condition and never a fixed sleep. Brittle locators, from CSS selectors tied to layout or text, are fixed with stable data-testid attributes. Shared state, from test order and data bleeding between tests, is fixed with isolated per-test data and a clean setup. Environment issues, from animations, viewport size and load, are fixed by controlling the environment and disabling animations. A footer notes that you can quarantine and retry a flaky test to unblock the build, but you must fix the root cause, because a flaky test everyone ignores is worse than no test.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .cause{fill:#fef2f2;stroke:#ef4444;stroke-width:1.3}
    .fix{fill:#ecfdf5;stroke:#10b981;stroke-width:1.3}
    .edge{stroke:#64748b;stroke-width:1.6;fill:none}
    .note{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .cause{fill:#3a1a1a;stroke:#f87171}.fix{fill:#064e3b;stroke:#34d399}.edge{stroke:#9ca3af}.note{fill:#3a2e0a;stroke:#fbbf24}
    }
  </style>
  <defs>
    <marker id="fl-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="410"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="408.5" rx="10"/>
  <text class="label ink h" x="24" y="30">UI tests are the flakiest layer &#8212; most flakiness has a known cause and fix</text>

  <text class="label red ph" x="70" y="58">Why it flakes</text>
  <text class="label green ph" x="470" y="58">The fix</text>

  <!-- row 1 timing -->
  <rect class="cause" x="24" y="68" width="330" height="44" rx="6"/>
  <text class="label ink s" x="36" y="86" font-weight="700">Timing</text>
  <text class="label muted s" x="36" y="102">async render / network &#8212; element not ready yet</text>
  <path class="edge" d="M354,90 L400,90" marker-end="url(#fl-a)"/>
  <rect class="fix" x="400" y="68" width="296" height="44" rx="6"/>
  <text class="label ink s" x="412" y="86" font-weight="700">Explicit waits for a condition</text>
  <text class="label mono muted" x="412" y="102" font-size="9">WebDriverWait(...).until(...) &#8212; never time.sleep()</text>

  <!-- row 2 locators -->
  <rect class="cause" x="24" y="120" width="330" height="44" rx="6"/>
  <text class="label ink s" x="36" y="138" font-weight="700">Brittle locators</text>
  <text class="label muted s" x="36" y="154">CSS tied to layout or text that keeps changing</text>
  <path class="edge" d="M354,142 L400,142" marker-end="url(#fl-a)"/>
  <rect class="fix" x="400" y="120" width="296" height="44" rx="6"/>
  <text class="label ink s" x="412" y="138" font-weight="700">Stable, intentional hooks</text>
  <text class="label mono muted" x="412" y="154" font-size="9">data-testid="submit" &#8212; decoupled from styling</text>

  <!-- row 3 shared state -->
  <rect class="cause" x="24" y="172" width="330" height="44" rx="6"/>
  <text class="label ink s" x="36" y="190" font-weight="700">Shared state</text>
  <text class="label muted s" x="36" y="206">test order / data bleeds between tests</text>
  <path class="edge" d="M354,194 L400,194" marker-end="url(#fl-a)"/>
  <rect class="fix" x="400" y="172" width="296" height="44" rx="6"/>
  <text class="label ink s" x="412" y="190" font-weight="700">Isolated per-test data</text>
  <text class="label muted s" x="412" y="206" font-size="10">fresh fixtures; each test sets up + tears down its own</text>

  <!-- row 4 environment -->
  <rect class="cause" x="24" y="224" width="330" height="44" rx="6"/>
  <text class="label ink s" x="36" y="242" font-weight="700">Environment</text>
  <text class="label muted s" x="36" y="258">animations, viewport, machine load, time zone</text>
  <path class="edge" d="M354,246 L400,246" marker-end="url(#fl-a)"/>
  <rect class="fix" x="400" y="224" width="296" height="44" rx="6"/>
  <text class="label ink s" x="412" y="242" font-weight="700">Control the environment</text>
  <text class="label muted s" x="412" y="258" font-size="10">fixed viewport, disable animations, pin the clock</text>

  <line class="frame" x1="24" y1="286" x2="696" y2="286" stroke="#cbd5e1"/>
  <rect class="note" x="24" y="296" width="672" height="46" rx="8"/>
  <text class="label amber s" x="38" y="314" font-weight="700">Quarantine &amp; retry to unblock &#8212; then fix the root cause</text>
  <text class="label muted s" x="38" y="332">Auto-retry can hide a real bug; a flaky test everyone ignores is worse than no test. Track flake rate and fix it.</text>

  <text class="label muted s" x="24" y="362">A test that passes and fails without the code changing isn't testing anything &#8212; it's noise that erodes trust in the</text>
  <text class="label muted s" x="24" y="380">whole suite. Most UI flakiness is timing: wait for the exact state you need, not a guessed number of seconds.</text>
</svg>
