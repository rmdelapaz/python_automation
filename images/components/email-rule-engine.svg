<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="er-title er-desc" preserveAspectRatio="xMidYMid meet">
  <title id="er-title">An email filter is a rule engine: conditions combine into a match, a match fires actions</title>
  <desc id="er-desc">An incoming email from billing at acme.com with subject Invoice 841 and a PDF attachment is tested against an ordered list of rules by priority. Each rule combines conditions and runs actions. Rule 2 matches because its two conditions, from contains acme.com AND subject contains Invoice, are both true. Its actions then run in order: add the label Finance, move to the Invoices folder, and mark as read. Because rules are evaluated by priority and this one stops on match, later rules are skipped. A note explains that conditions can be combined with AND or OR, a rule can trigger several actions, and whether evaluation stops or continues after a match is a choice.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .mail{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.3}
    .rule{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.2}
    .rulehot{fill:#fffbeb;stroke:#f59e0b;stroke-width:2}
    .cond{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}
    .act{fill:#ecfdf5;stroke:#10b981;stroke-width:1.3}
    .edge{stroke:#64748b;stroke-width:1.6;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .mail{fill:#26262a;stroke:#6b7280}.rule{fill:#1e293b;stroke:#569cd6}.rulehot{fill:#3a2e0a;stroke:#fbbf24}
      .cond{fill:#3a2e0a;stroke:#fbbf24}.act{fill:#064e3b;stroke:#34d399}.edge{stroke:#9ca3af}
    }
  </style>
  <defs>
    <marker id="er-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="410"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="408.5" rx="10"/>
  <text class="label ink h" x="24" y="30">A filter tests each email against ordered rules: match &#8594; run its actions</text>

  <!-- incoming mail -->
  <text class="label muted ph" x="24" y="56">Incoming email</text>
  <rect class="mail" x="24" y="64" width="196" height="80" rx="7"/>
  <text class="label mono ink" x="36" y="84">From: billing@acme.com</text>
  <text class="label mono ink" x="36" y="102">Subject: Invoice #841</text>
  <text class="label mono muted" x="36" y="120">&#128206; invoice.pdf</text>
  <text class="label muted s" x="36" y="137">tested top-down by priority &#8595;</text>

  <!-- rules list -->
  <text class="label muted ph" x="240" y="56">Rules (by priority)</text>
  <rect class="rule" x="240" y="64" width="456" height="26" rx="5"/>
  <text class="label mono muted" x="252" y="81">1. from contains "newsletter"  &#8594;  move Promotions</text>
  <text class="label mono muted" x="640" y="81" text-anchor="end">no match</text>

  <rect class="rulehot" x="240" y="96" width="456" height="70" rx="6"/>
  <text class="label mono ink" x="252" y="114" font-weight="700">2. IF  from contains "acme.com"  AND  subject contains "Invoice"</text>
  <rect class="cond" x="252" y="122" width="200" height="20" rx="4"/><text class="label mono amber" x="262" y="136">both conditions true &#10003;</text>
  <text class="label mono ink" x="470" y="136" font-weight="700">&#8594; matches</text>
  <text class="label mono muted" x="252" y="158">THEN run actions (in order), then stop</text>

  <rect class="rule" x="240" y="172" width="456" height="26" rx="5"/>
  <text class="label mono muted" x="252" y="189">3. else  &#8594;  leave in Inbox</text>
  <text class="label mono muted" x="640" y="189" text-anchor="end">skipped</text>

  <!-- actions -->
  <path class="edge" d="M300,166 L300,214" marker-end="url(#er-a)"/>
  <text class="label green ph" x="330" y="222">Actions fire in sequence</text>
  <rect class="act" x="240" y="230" width="140" height="30" rx="6"/><text class="label mono ink" x="252" y="249">label "Finance"</text>
  <rect class="act" x="392" y="230" width="150" height="30" rx="6"/><text class="label mono ink" x="404" y="249">move &#8594; /Invoices</text>
  <rect class="act" x="554" y="230" width="142" height="30" rx="6"/><text class="label mono ink" x="566" y="249">mark as read</text>

  <line class="frame" x1="24" y1="284" x2="696" y2="284" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="306">A rule is conditions &#8594; actions. Combine conditions with <tspan class="ink" font-weight="700">AND</tspan> (all must hold) or <tspan class="ink" font-weight="700">OR</tspan> (any), and give a rule several</text>
  <text class="label muted s" x="24" y="324">actions. Order rules by priority; decide whether a match <tspan class="ink" font-weight="700">stops</tspan> evaluation or lets later rules also run.</text>
  <text class="label muted s" x="24" y="350">Put specific rules first and a catch-all last (like Module 1's file router) so nothing is silently mislabeled. Keep</text>
  <text class="label muted s" x="24" y="368">rules data (a list of dicts), not tangled if/else, so they're easy to test, reorder, and add to.</text>
  <text class="label muted s" x="24" y="392">Beware overlapping rules: with stop-on-first-match, a broad early rule can shadow a precise later one.</text>
</svg>
