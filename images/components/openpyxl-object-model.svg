<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="xl-title xl-desc" preserveAspectRatio="xMidYMid meet">
  <title id="xl-title">The openpyxl object model and why it does not evaluate formulas</title>
  <desc id="xl-desc">On the left, the openpyxl object hierarchy: a Workbook contains Worksheets, each addressed by title, and each Worksheet is a grid of Cells addressed like A1 or by row and column. A cell carries three things: a value, an optional formula, and a style such as number format, font and fill. On the right, the formula caveat: openpyxl writes the formula equals SUM B2 through B4 as a literal string and does not compute it; the number is calculated only when Excel opens the file. To read a computed result, load the workbook with data_only True, which returns the last value Excel cached, or None if the file was never opened in Excel.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10.5px}
    .monos{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .wb{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}
    .ws{fill:#f0f9ff;stroke:#3b82f6;stroke-width:1.2}
    .cellbox{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.3}
    .grid{fill:#f8fafc;stroke:#94a3b8;stroke-width:1}
    .gridhot{fill:#fef3c7;stroke:#f59e0b;stroke-width:1.4}
    .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
    .warn{fill:#fef2f2;stroke:#ef4444;stroke-width:1.2}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .wb{fill:#1e293b;stroke:#569cd6}.ws{fill:#18212e;stroke:#569cd6}.cellbox{fill:#3a2e0a;stroke:#fbbf24}
      .grid{fill:#26262a;stroke:#6b7280}.gridhot{fill:#4a3a0a;stroke:#fbbf24}
      .panel{fill:#26262a;stroke:#3f3f46}.warn{fill:#3a1a1a;stroke:#f87171}
    }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="410"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="408.5" rx="10"/>
  <text class="label ink h" x="24" y="30">A spreadsheet is objects: Workbook &#8594; Worksheet &#8594; Cell (value, formula, style)</text>

  <!-- LEFT: hierarchy -->
  <rect class="wb" x="24" y="48" width="330" height="250" rx="9"/>
  <text class="label blue ph" x="38" y="70">Workbook  (the .xlsx file)</text>
  <rect class="ws" x="40" y="80" width="298" height="204" rx="7"/>
  <text class="label blue t" x="52" y="98" font-weight="700">Worksheet  wb["Data"]</text>
  <!-- mini grid -->
  <g>
    <rect class="grid" x="56" y="108" width="40" height="22"/><text class="label monos muted" x="70" y="123" text-anchor="middle">A</text>
    <rect class="grid" x="96" y="108" width="60" height="22"/><text class="label monos muted" x="126" y="123" text-anchor="middle">B</text>
    <rect class="grid" x="156" y="108" width="60" height="22"/><text class="label monos muted" x="186" y="123" text-anchor="middle">C</text>
    <rect class="grid" x="56" y="130" width="40" height="22"/><text class="label monos ink" x="70" y="145" text-anchor="middle">Jan</text>
    <rect class="grid" x="96" y="130" width="60" height="22"/><text class="label monos ink" x="126" y="145" text-anchor="middle">100</text>
    <rect class="grid" x="156" y="130" width="60" height="22"/><text class="label monos ink" x="186" y="145" text-anchor="middle">&#8230;</text>
    <rect class="grid" x="56" y="152" width="40" height="22"/><text class="label monos ink" x="70" y="167" text-anchor="middle">Feb</text>
    <rect class="grid" x="96" y="152" width="60" height="22"/><text class="label monos ink" x="126" y="167" text-anchor="middle">120</text>
    <rect class="grid" x="156" y="152" width="60" height="22"/><text class="label monos ink" x="186" y="167" text-anchor="middle">&#8230;</text>
    <rect class="gridhot" x="96" y="174" width="60" height="22"/><text class="label monos amber" x="126" y="189" text-anchor="middle" font-weight="700">B4</text>
  </g>
  <path d="M156,185 L214,185" fill="none" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#xl-a)"/>
  <!-- cell anatomy -->
  <rect class="cellbox" x="220" y="112" width="112" height="82" rx="6"/>
  <text class="label amber s" x="230" y="128" font-weight="700">cell B4 holds</text>
  <text class="label monos ink" x="230" y="146">.value</text>
  <text class="label monos ink" x="230" y="162">.formula</text>
  <text class="label monos ink" x="230" y="178">.font/.fill</text>
  <text class="label monos muted" x="230" y="192">.number_format</text>
  <text class="label muted s" x="52" y="212">Address by name ws["B4"] or index</text>
  <text class="label muted s" x="52" y="228">ws.cell(row=4, column=2).</text>
  <text class="label muted s" x="52" y="252">Iterate ws.iter_rows() / ws.rows;</text>
  <text class="label muted s" x="52" y="268">wb.save("out.xlsx") writes it all back.</text>

  <!-- RIGHT: formula caveat -->
  <rect class="panel" x="370" y="48" width="326" height="250" rx="9"/>
  <text class="label ink ph" x="384" y="70">The formula gotcha</text>
  <rect class="warn" x="384" y="80" width="298" height="60" rx="6"/>
  <text class="label mono ink" x="396" y="100">ws["B4"] = "=SUM(B2:B4)"</text>
  <text class="label red s" x="396" y="120" font-weight="700">openpyxl stores the STRING &#8212;</text>
  <text class="label red s" x="396" y="134" font-weight="700">it does not compute the total.</text>
  <text class="label muted s" x="384" y="162">The number appears only when Excel opens</text>
  <text class="label muted s" x="384" y="178">the file and evaluates the formula.</text>
  <rect class="cellbox" x="384" y="192" width="298" height="54" rx="6"/>
  <text class="label mono ink" x="396" y="212">load_workbook(f, data_only=True)</text>
  <text class="label amber s" x="396" y="230">reads Excel's last CACHED value</text>
  <text class="label amber s" x="396" y="242" font-size="10">(None if the file was never opened in Excel)</text>
  <text class="label muted s" x="384" y="270">So: write formulas as strings; read results</text>
  <text class="label muted s" x="384" y="286">with data_only &#8212; never both from one handle.</text>

  <line class="frame" x1="24" y1="330" x2="696" y2="330" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="352">Think in objects, not screens: you set a cell's .value, style, or formula string, then save. openpyxl is not Excel</text>
  <text class="label muted s" x="24" y="370">&#8212; it never runs the calc engine, so a freshly written formula has no value until Excel (or LibreOffice) opens it.</text>
  <text class="label muted s" x="24" y="394">Need Python to do the math? Compute it in Python and write the number; use a formula only for the Excel user.</text>
  <defs><marker id="xl-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
</svg>
