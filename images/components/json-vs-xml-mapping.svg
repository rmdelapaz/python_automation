<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="jx-title jx-desc" preserveAspectRatio="xMidYMid meet">
  <title id="jx-title">The same data as JSON maps to Python types; as XML it stays a node tree</title>
  <desc id="jx-desc">The same record shown two ways. As JSON, an object with name Bob, age 30, and a roles array of dev and lead deserializes with json.loads straight into native Python types: a dict, an int, strings and a list, accessed like data with square-bracket roles. As XML, a person element with name and age attributes and two role child elements is parsed with ElementTree into a node tree, accessed through tag, attrib, text and findall; roles come from root.findall of role, each read as element dot text. Same data, but JSON becomes native containers while XML remains a tree you navigate.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10.5px}
    .monos{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}
    .jsonp{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.4}
    .xmlp{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.4}
    .code{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1}
    .pytype{fill:#ecfdf5;stroke:#10b981;stroke-width:1.1}
    .node{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
    .edge{stroke:#94a3b8;stroke-width:1.3;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}
      .jsonp{fill:#1e293b;stroke:#569cd6}.xmlp{fill:#3a2e0a;stroke:#fbbf24}.code{fill:#26262a;stroke:#3f3f46}
      .pytype{fill:#064e3b;stroke:#34d399}.node{fill:#26262a;stroke:#6b7280}.edge{stroke:#6b7280}
    }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="410"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="408.5" rx="10"/>
  <text class="label ink h" x="24" y="30">Same data, two models: JSON becomes Python containers, XML stays a tree</text>

  <!-- JSON -->
  <rect class="jsonp" x="24" y="46" width="330" height="300" rx="9"/>
  <text class="label blue ph" x="38" y="68">JSON</text>
  <rect class="code" x="38" y="78" width="302" height="80" rx="6"/>
  <text class="label monos ink" x="50" y="96">{</text>
  <text class="label monos ink" x="62" y="112">"name": "Bob", "age": 30,</text>
  <text class="label monos ink" x="62" y="128">"roles": ["dev", "lead"]</text>
  <text class="label monos ink" x="50" y="144">}</text>
  <text class="label muted s" x="38" y="178">json.loads(text)  &#8594;  native types</text>
  <rect class="pytype" x="38" y="188" width="146" height="24" rx="4"/><text class="label monos green" x="48" y="204">dict {name, age, roles}</text>
  <rect class="pytype" x="192" y="188" width="60" height="24" rx="4"/><text class="label monos green" x="202" y="204">int 30</text>
  <rect class="pytype" x="38" y="218" width="200" height="24" rx="4"/><text class="label monos green" x="48" y="234">list ["dev", "lead"]</text>
  <text class="label muted s" x="38" y="266">access it like any Python object:</text>
  <rect class="code" x="38" y="276" width="302" height="56" rx="6"/>
  <text class="label monos ink" x="50" y="296">data["name"]     &#8594; "Bob"</text>
  <text class="label monos ink" x="50" y="314">data["roles"][0] &#8594; "dev"</text>

  <!-- XML -->
  <rect class="xmlp" x="366" y="46" width="330" height="300" rx="9"/>
  <text class="label amber ph" x="380" y="68">XML</text>
  <rect class="code" x="380" y="78" width="302" height="80" rx="6"/>
  <text class="label monos ink" x="392" y="96">&#60;person name="Bob" age="30"&#62;</text>
  <text class="label monos ink" x="404" y="112">&#60;role&#62;dev&#60;/role&#62;</text>
  <text class="label monos ink" x="404" y="128">&#60;role&#62;lead&#60;/role&#62;</text>
  <text class="label monos ink" x="392" y="144">&#60;/person&#62;</text>
  <text class="label muted s" x="380" y="178">ElementTree.fromstring(text)  &#8594;  a tree</text>
  <!-- mini tree -->
  <rect class="node" x="470" y="188" width="120" height="24" rx="4"/><text class="label monos ink" x="480" y="204">person (attrib)</text>
  <path class="edge" d="M500,212 L470,232"/><path class="edge" d="M540,212 L570,232"/>
  <rect class="node" x="404" y="232" width="132" height="22" rx="4"/><text class="label monos ink" x="414" y="247">role.text "dev"</text>
  <rect class="node" x="548" y="232" width="132" height="22" rx="4"/><text class="label monos ink" x="558" y="247">role.text "lead"</text>
  <text class="label muted s" x="380" y="276">navigate by tag / attrib / text:</text>
  <rect class="code" x="380" y="286" width="302" height="46" rx="6"/>
  <text class="label monos ink" x="392" y="304">root.get("name")        &#8594; "Bob"</text>
  <text class="label monos ink" x="392" y="320">root.findall("role")[0].text</text>

  <line class="frame" x1="24" y1="360" x2="696" y2="360" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="382">JSON deserializes into dicts and lists you already know how to use; XML gives you element nodes with tags,</text>
  <text class="label muted s" x="24" y="400">attributes, and text that you walk with find/findall. Pick the mental model the format hands you.</text>
</svg>
