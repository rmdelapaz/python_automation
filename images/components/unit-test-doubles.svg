<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="ud-title ud-desc" preserveAspectRatio="xMidYMid meet">
  <title id="ud-title">A unit test isolates one unit by replacing its real dependencies with test doubles</title>
  <desc id="ud-desc">Why unit tests use test doubles. On the left, the function under test, process_order, calls real dependencies — a database, a payment API and datetime.now — which makes a test slow, networked and non-deterministic. On the right, the same function is tested with those dependencies replaced by test doubles, making the test fast, isolated and repeatable. A table defines the four kinds of double: a stub returns canned data with no logic; a mock returns canned data and also verifies it was called correctly; a fake is a lightweight working implementation such as an in-memory database; and a spy wraps the real thing and records the calls made to it.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .unit{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}
    .realdep{fill:#fef2f2;stroke:#ef4444;stroke-width:1.2}
    .dbl{fill:#ecfdf5;stroke:#10b981;stroke-width:1.2}
    .double{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.1}
    .edge{stroke:#64748b;stroke-width:1.5;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .unit{fill:#1e1b3a;stroke:#818cf8}.realdep{fill:#3a1a1a;stroke:#f87171}.dbl{fill:#064e3b;stroke:#34d399}
      .double{fill:#26262a;stroke:#6b7280}.edge{stroke:#9ca3af}
    }
  </style>
  <defs>
    <marker id="ud-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="410"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="408.5" rx="10"/>
  <text class="label ink h" x="24" y="30">To test one unit, replace what it depends on with test doubles</text>

  <!-- LEFT: real deps -->
  <text class="label red ph" x="24" y="56">With real dependencies</text>
  <rect class="unit" x="96" y="64" width="170" height="30" rx="6"/><text class="label mono ink" x="181" y="84" text-anchor="middle" font-weight="700">process_order()</text>
  <path class="edge" d="M120,94 L70,124" marker-end="url(#ud-a)"/>
  <path class="edge" d="M181,94 L181,124" marker-end="url(#ud-a)"/>
  <path class="edge" d="M242,94 L292,124" marker-end="url(#ud-a)"/>
  <rect class="realdep" x="26" y="126" width="88" height="34" rx="5"/><text class="label s ink" x="70" y="147" text-anchor="middle">Database</text>
  <rect class="realdep" x="137" y="126" width="88" height="34" rx="5"/><text class="label s ink" x="181" y="147" text-anchor="middle">Payment API</text>
  <rect class="realdep" x="248" y="126" width="96" height="34" rx="5"/><text class="label mono ink" x="296" y="147" text-anchor="middle" font-size="9">datetime.now()</text>
  <text class="label red s" x="24" y="182" font-weight="700">&#10007; slow &#183; networked &#183; non-deterministic</text>

  <!-- divider -->
  <line class="frame" x1="360" y1="50" x2="360" y2="196" stroke="#cbd5e1"/>

  <!-- RIGHT: doubles -->
  <text class="label green ph" x="378" y="56">With test doubles</text>
  <rect class="unit" x="456" y="64" width="170" height="30" rx="6"/><text class="label mono ink" x="541" y="84" text-anchor="middle" font-weight="700">process_order()</text>
  <path class="edge" d="M480,94 L430,124" marker-end="url(#ud-a)"/>
  <path class="edge" d="M541,94 L541,124" marker-end="url(#ud-a)"/>
  <path class="edge" d="M602,94 L652,124" marker-end="url(#ud-a)"/>
  <rect class="dbl" x="386" y="126" width="88" height="34" rx="5"/><text class="label s ink" x="430" y="143" text-anchor="middle">fake DB</text><text class="label muted" x="430" y="155" text-anchor="middle" font-size="8">in-memory</text>
  <rect class="dbl" x="497" y="126" width="88" height="34" rx="5"/><text class="label s ink" x="541" y="143" text-anchor="middle">mock pay</text><text class="label muted" x="541" y="155" text-anchor="middle" font-size="8">verifies call</text>
  <rect class="dbl" x="608" y="126" width="88" height="34" rx="5"/><text class="label s ink" x="652" y="143" text-anchor="middle">frozen clock</text><text class="label muted" x="652" y="155" text-anchor="middle" font-size="8">fixed time</text>
  <text class="label green s" x="378" y="182" font-weight="700">&#10003; fast &#183; isolated &#183; repeatable</text>

  <line class="frame" x1="24" y1="204" x2="696" y2="204" stroke="#cbd5e1"/>

  <!-- DOUBLES TABLE -->
  <text class="label muted ph" x="24" y="226">The four kinds of double</text>
  <rect class="double" x="24" y="234" width="330" height="34" rx="5"/><text class="label ink s" x="36" y="248" font-weight="700">Stub</text><text class="label muted s" x="96" y="248">returns canned data, no logic</text><text class="label muted s" x="96" y="262" font-size="10">"when asked, reply X"</text>
  <rect class="double" x="366" y="234" width="330" height="34" rx="5"/><text class="label ink s" x="378" y="248" font-weight="700">Mock</text><text class="label muted s" x="438" y="248">canned data + verifies the interaction</text><text class="label muted s" x="438" y="262" font-size="10">"assert it was called with&#8230;"</text>
  <rect class="double" x="24" y="272" width="330" height="34" rx="5"/><text class="label ink s" x="36" y="286" font-weight="700">Fake</text><text class="label muted s" x="96" y="286">a lightweight working implementation</text><text class="label muted s" x="96" y="300" font-size="10">e.g. an in-memory database</text>
  <rect class="double" x="366" y="272" width="330" height="34" rx="5"/><text class="label ink s" x="378" y="286" font-weight="700">Spy</text><text class="label muted s" x="438" y="286">wraps the real thing and records calls</text><text class="label muted s" x="438" y="300" font-size="10">real behavior + a call log</text>

  <line class="frame" x1="24" y1="326" x2="696" y2="326" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="348">A unit test checks <tspan class="ink" font-weight="700">one unit in isolation</tspan>, so its real collaborators are swapped for doubles that are fast and</text>
  <text class="label muted s" x="24" y="366">deterministic. That's what makes unit tests quick and reliable &#8212; and why a failure points at your code, not the network.</text>
  <text class="label muted s" x="24" y="392">In Python: unittest.mock (Mock, MagicMock, patch) covers most cases; reach for a fake when a stub gets too complex.</text>
</svg>
