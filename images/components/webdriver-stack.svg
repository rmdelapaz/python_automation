<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="wd-title wd-desc" preserveAspectRatio="xMidYMid meet">
  <title id="wd-title">The Selenium WebDriver stack and why driver and browser versions must match</title>
  <desc id="wd-desc">A four-layer stack. Your Python script calls Selenium WebDriver, the language binding, which translates each call into a W3C WebDriver command sent as HTTP and JSON to a local driver executable such as chromedriver or geckodriver. That driver process drives the real browser through its native automation interface. A side panel shows the version-match rule: Chrome 126 with chromedriver 126 works, but Chrome 126 with chromedriver 124 raises SessionNotCreated. Selenium 4.6 and later ship Selenium Manager, which downloads the matching driver automatically.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10.5px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .l1{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}
    .l2{fill:#f0f9ff;stroke:#3b82f6;stroke-width:1.3}
    .l3{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.5}
    .l4{fill:#ecfdf5;stroke:#10b981;stroke-width:1.5}
    .edge{stroke:#64748b;stroke-width:1.8;fill:none}
    .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
    .okrow{fill:#ecfdf5;stroke:#10b981;stroke-width:1.2}
    .badrow{fill:#fef2f2;stroke:#ef4444;stroke-width:1.2}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .l1{fill:#1e293b;stroke:#569cd6}.l2{fill:#18212e;stroke:#569cd6}.l3{fill:#3a2e0a;stroke:#fbbf24}.l4{fill:#064e3b;stroke:#34d399}
      .edge{stroke:#9ca3af}.panel{fill:#26262a;stroke:#3f3f46}
      .okrow{fill:#064e3b;stroke:#34d399}.badrow{fill:#3a1a1a;stroke:#f87171}
    }
  </style>
  <defs>
    <marker id="wd-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="420"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="418.5" rx="10"/>
  <text class="label ink h" x="24" y="30">Selenium drives a real browser through a driver &#8212; so their versions must match</text>

  <!-- STACK -->
  <text class="label muted ph" x="26" y="56">The stack (top talks down to bottom)</text>
  <rect class="l1" x="30" y="64" width="378" height="44" rx="7"/>
  <text class="label t ink" x="46" y="84" font-weight="700">Your Python script</text>
  <text class="label mono muted" x="46" y="100">driver.get(url) &#183; find_element() &#183; click()</text>

  <path class="edge" d="M219,108 L219,124" marker-end="url(#wd-a)"/>
  <text class="label s muted" x="228" y="120">Selenium API call</text>

  <rect class="l2" x="30" y="124" width="378" height="44" rx="7"/>
  <text class="label t ink" x="46" y="144" font-weight="700">Selenium WebDriver (language binding)</text>
  <text class="label mono muted" x="46" y="160">translates each call into a W3C command</text>

  <path class="edge" d="M219,168 L219,190" marker-end="url(#wd-a)"/>
  <text class="label s blue" x="228" y="182">W3C WebDriver protocol &#8212; HTTP + JSON (localhost)</text>

  <rect class="l3" x="30" y="190" width="378" height="44" rx="7"/>
  <text class="label t ink" x="46" y="210" font-weight="700">Driver executable</text>
  <text class="label mono muted" x="46" y="226">chromedriver / geckodriver &#8212; a local server</text>

  <path class="edge" d="M219,234 L219,256" marker-end="url(#wd-a)"/>
  <text class="label s muted" x="228" y="250">native automation interface</text>

  <rect class="l4" x="30" y="256" width="378" height="44" rx="7"/>
  <text class="label t ink" x="46" y="276" font-weight="700">Real browser</text>
  <text class="label mono muted" x="46" y="292">Chrome / Firefox / Edge (the actual app)</text>

  <!-- VERSION PANEL -->
  <line class="frame" x1="428" y1="52" x2="428" y2="312" stroke="#cbd5e1"/>
  <rect class="panel" x="444" y="60" width="252" height="242" rx="9"/>
  <text class="label ink ph" x="460" y="84">Match the versions</text>
  <rect class="okrow" x="458" y="98" width="224" height="46" rx="6"/>
  <text class="label mono ink" x="470" y="116">Chrome 126  &#8596;  chromedriver 126</text>
  <text class="label s green" x="470" y="134" font-weight="700">&#10003; session starts</text>
  <rect class="badrow" x="458" y="152" width="224" height="46" rx="6"/>
  <text class="label mono ink" x="470" y="170">Chrome 126  &#8596;  chromedriver 124</text>
  <text class="label s red" x="470" y="188" font-weight="700">&#10007; SessionNotCreated</text>
  <text class="label s muted" x="460" y="222">The driver speaks one browser version.</text>
  <text class="label s muted" x="460" y="240">Selenium 4.6+ bundles Selenium Manager,</text>
  <text class="label s muted" x="460" y="258">which downloads the matching driver for</text>
  <text class="label s muted" x="460" y="276">you &#8212; so setup is usually automatic now.</text>

  <line class="frame" x1="24" y1="330" x2="696" y2="330" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="352">Every Selenium call becomes an HTTP request to the driver, which drives the real browser on your behalf. That</text>
  <text class="label muted s" x="24" y="370">indirection is the whole model &#8212; and the reason a driver built for one browser version cannot pilot another.</text>
  <text class="label muted s" x="24" y="396">Takeaway: let Selenium Manager resolve drivers; reach for a manual driver path only for pinned or offline setups.</text>
</svg>
