<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="ma-title ma-desc" preserveAspectRatio="xMidYMid meet">
  <title id="ma-title">HTML email uses multipart/alternative to ship a text and an HTML version of the same content</title>
  <desc id="ma-desc">An HTML email is a MIME multipart/alternative tree holding two versions of the same message: a text/plain fallback and a text/html version. The parts are ordered from least to most preferred, so HTML comes last. Each client renders the richest version it can: a modern client shows the HTML, while a plain-text client or watch falls back to the text. A side panel lists the rules for the HTML part: inline your CSS because clients strip the head and style tags, lay out with tables rather than flexbox or grid, keep images with alt text, and always include the plain-text alternative for deliverability.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}
    .root{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}
    .textpart{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.3}
    .htmlpart{fill:#ecfdf5;stroke:#10b981;stroke-width:1.4}
    .edge{stroke:#94a3b8;stroke-width:1.4;fill:none}
    .client{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}
    .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}
      .root{fill:#1e293b;stroke:#569cd6}.textpart{fill:#26262a;stroke:#6b7280}.htmlpart{fill:#064e3b;stroke:#34d399}
      .edge{stroke:#6b7280}.client{fill:#3a2e0a;stroke:#fbbf24}.panel{fill:#26262a;stroke:#3f3f46}
    }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="400"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="398.5" rx="10"/>
  <text class="label ink h" x="24" y="30">Send both versions: the client picks HTML if it can, text if it can't</text>

  <!-- TREE -->
  <rect class="root" x="40" y="52" width="240" height="38" rx="7"/>
  <text class="label blue t" x="54" y="70" font-weight="700">multipart/alternative</text>
  <text class="label mono muted" x="54" y="84">same content, two renderings</text>

  <path class="edge" d="M100,90 L80,126"/>
  <path class="edge" d="M220,90 L250,126"/>

  <rect class="textpart" x="24" y="126" width="210" height="58" rx="7"/>
  <text class="label ink t" x="38" y="146" font-weight="700">text/plain  (fallback)</text>
  <text class="label mono muted" x="38" y="164">"Your order shipped. Track:</text>
  <text class="label mono muted" x="38" y="178">https://&#8230;"</text>

  <rect class="htmlpart" x="250" y="126" width="230" height="58" rx="7"/>
  <text class="label ink t" x="264" y="146" font-weight="700">text/html  (preferred, last)</text>
  <text class="label mono muted" x="264" y="164">&#60;h1&#62;Shipped!&#60;/h1&#62; &#60;a class=btn&#62;</text>
  <text class="label mono muted" x="264" y="178">Track order&#60;/a&#62;</text>

  <text class="label muted s" x="24" y="204">order = least &#8594; most preferred; the client renders the richest it supports:</text>

  <!-- CLIENTS -->
  <path class="edge" d="M130,208 L120,232" marker-end="url(#ma-a)"/>
  <path class="edge" d="M360,208 L360,232" marker-end="url(#ma-a)"/>
  <rect class="client" x="40" y="232" width="180" height="48" rx="7"/>
  <text class="label amber s" x="54" y="252" font-weight="700">plain-text client / watch</text>
  <text class="label muted s" x="54" y="270">shows the text/plain part</text>
  <rect class="htmlpart" x="270" y="232" width="180" height="48" rx="7"/>
  <text class="label green s" x="284" y="252" font-weight="700">Gmail / Outlook / Apple</text>
  <text class="label muted s" x="284" y="270">renders the text/html part</text>

  <!-- PANEL -->
  <rect class="panel" x="470" y="52" width="226" height="228" rx="9"/>
  <text class="label ink ph" x="484" y="74">Rules for the HTML part</text>
  <text class="label t ink" x="484" y="102">&#8226; Inline every style &#8212; clients</text>
  <text class="label muted s" x="496" y="118">strip &#60;head&#62; and &#60;style&#62;</text>
  <text class="label t ink" x="484" y="142">&#8226; Lay out with &#60;table&#62;, not</text>
  <text class="label muted s" x="496" y="158">flexbox or grid (poor support)</text>
  <text class="label t ink" x="484" y="182">&#8226; Images need alt text &amp; are</text>
  <text class="label muted s" x="496" y="198">often blocked until allowed</text>
  <text class="label t ink" x="484" y="222">&#8226; Always ship the plain-text</text>
  <text class="label muted s" x="496" y="238">twin &#8212; it helps deliverability</text>
  <text class="label muted s" x="484" y="264">Test in real clients; each has</text>
  <text class="label muted s" x="484" y="278">its own quirks.</text>

  <line class="frame" x1="24" y1="300" x2="696" y2="300" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="322">multipart/alternative means "here are two forms of the same message." In Python: msg.set_content(text) for the</text>
  <text class="label muted s" x="24" y="340">fallback, then msg.add_alternative(html, subtype="html") &#8212; add HTML last so preferring clients choose it.</text>
  <text class="label muted s" x="24" y="366">Email HTML is a 1998 subset of the web: inline CSS and table layout aren't retro style, they're what actually renders.</text>
  <defs><marker id="ma-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker></defs>
</svg>
