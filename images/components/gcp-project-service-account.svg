<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="gcp-title gcp-desc" preserveAspectRatio="xMidYMid meet">
  <title id="gcp-title">On GCP everything lives under a Project and code authenticates as a service account</title>
  <desc id="gcp-desc">Two ideas about Google Cloud. First, the resource hierarchy: an Organization contains Folders, which contain Projects, and every resource such as Compute Engine, Cloud Storage or BigQuery lives inside a Project. A Project is the unit of billing, enabled APIs, and IAM, so every call is scoped to a project id. Second, authentication: your code runs as a service account, a non-human machine identity, discovered through Application Default Credentials. Locally you point the GOOGLE_APPLICATION_CREDENTIALS environment variable at a key JSON file, while on GCP the attached service account is used automatically with no key file, which is preferred. The client libraries call google.auth.default to find these credentials.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .org{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.3}
    .folder{fill:#f0f9ff;stroke:#3b82f6;stroke-width:1.1}
    .project{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.6}
    .res{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.1}
    .sa{fill:#ecfdf5;stroke:#10b981;stroke-width:1.3}
    .avoid{fill:#fef2f2;stroke:#ef4444;stroke-width:1.1}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .org{fill:#1e293b;stroke:#569cd6}.folder{fill:#18212e;stroke:#569cd6}.project{fill:#3a2e0a;stroke:#fbbf24}
      .res{fill:#26262a;stroke:#6b7280}.sa{fill:#064e3b;stroke:#34d399}.avoid{fill:#3a1a1a;stroke:#f87171}
    }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="410"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="408.5" rx="10"/>
  <text class="label ink h" x="24" y="30">GCP: everything sits inside a Project, and your code acts as a service account</text>

  <!-- HIERARCHY -->
  <text class="label muted ph" x="24" y="56">Resource hierarchy</text>
  <rect class="org" x="24" y="64" width="330" height="230" rx="8"/>
  <text class="label blue t" x="38" y="84" font-weight="700">Organization</text>
  <rect class="folder" x="40" y="92" width="298" height="190" rx="7"/>
  <text class="label blue s" x="54" y="110" font-weight="700">Folder (team / dept)</text>
  <rect class="project" x="56" y="118" width="266" height="152" rx="7"/>
  <text class="label amber t" x="70" y="138" font-weight="700">Project  my-app-prod</text>
  <text class="label mono muted" x="70" y="154" font-size="9">the unit of billing &#183; enabled APIs &#183; IAM</text>
  <rect class="res" x="70" y="164" width="112" height="42" rx="5"/><text class="label s ink" x="82" y="182">Compute</text><text class="label s ink" x="82" y="198">Engine</text>
  <rect class="res" x="192" y="164" width="116" height="42" rx="5"/><text class="label s ink" x="204" y="182">Cloud</text><text class="label s ink" x="204" y="198">Storage</text>
  <rect class="res" x="70" y="212" width="238" height="42" rx="5"/><text class="label s ink" x="82" y="238">BigQuery &#183; Cloud SQL &#183; Pub/Sub</text>
  <text class="label muted s" x="24" y="288">Every API call is scoped to a project id.</text>

  <!-- AUTH -->
  <text class="label muted ph" x="378" y="56">Authenticate as a service account</text>
  <rect class="sa" x="378" y="64" width="318" height="52" rx="8"/>
  <text class="label green t" x="392" y="84" font-weight="700">Service account</text>
  <text class="label muted s" x="392" y="102">a non-human machine identity with IAM roles</text>
  <text class="label muted s" x="378" y="136">Application Default Credentials finds it:</text>

  <rect class="avoid" x="378" y="146" width="318" height="52" rx="7"/>
  <text class="label t ink" x="392" y="164" font-weight="700">Local dev</text>
  <text class="label mono muted" x="392" y="182">GOOGLE_APPLICATION_CREDENTIALS=key.json</text>
  <text class="label red s" x="392" y="194" font-size="9">a downloadable key file &#8212; guard it, it's a password</text>

  <rect class="sa" x="378" y="204" width="318" height="52" rx="7"/>
  <text class="label t ink" x="392" y="222" font-weight="700">On GCP  &#9733;</text>
  <text class="label mono muted" x="392" y="240">attached service account &#8212; no key file</text>
  <text class="label green s" x="392" y="252" font-size="9">auto, rotating &#8212; the preferred way</text>
  <text class="label mono muted" x="378" y="278" font-size="9">client libs call google.auth.default() to pick these up</text>

  <line class="frame" x1="24" y1="312" x2="696" y2="312" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="334">Two things orient you on GCP. Everything you create belongs to a <tspan class="ink" font-weight="700">Project</tspan> &#8212; that's where you enable the API,</text>
  <text class="label muted s" x="24" y="352">attach billing, and grant IAM &#8212; so a "permission denied" is usually a disabled API or missing role on that project.</text>
  <text class="label muted s" x="24" y="378">And code runs as a <tspan class="ink" font-weight="700">service account</tspan>, not you; prefer an attached identity over a key file so there's nothing to leak.</text>
</svg>
