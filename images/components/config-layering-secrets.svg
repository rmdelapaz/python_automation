<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="cf-title cf-desc" preserveAspectRatio="xMidYMid meet">
  <title id="cf-title">Layer configuration by precedence and keep secrets out of code</title>
  <desc id="cf-desc">Two ideas for managing environments. First, configuration is layered by precedence, with later sources overriding earlier ones: code defaults are the lowest, then a config file such as config.yaml, then environment variables, then command-line flags at runtime, which are the highest. The effective value for any setting is whichever the highest layer that sets it provides. Second, secrets must never live in code or git: load them from environment variables or a secret manager, keep a dotenv file in gitignore, and commit a dotenv example with keys but no values. A footer notes that a virtual environment isolates each project's dependencies so package versions don't clash.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .l1{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
    .l2{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.2}
    .l3{fill:#eef2ff;stroke:#6366f1;stroke-width:1.2}
    .l4{fill:#ecfdf5;stroke:#10b981;stroke-width:1.4}
    .secret{fill:#fef2f2;stroke:#ef4444;stroke-width:1.3}
    .okbox{fill:#ecfdf5;stroke:#10b981;stroke-width:1.2}
    .edge{stroke:#64748b;stroke-width:1.6;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .l1{fill:#26262a;stroke:#6b7280}.l2{fill:#1e293b;stroke:#569cd6}.l3{fill:#1e1b3a;stroke:#818cf8}.l4{fill:#064e3b;stroke:#34d399}
      .secret{fill:#3a1a1a;stroke:#f87171}.okbox{fill:#064e3b;stroke:#34d399}.edge{stroke:#9ca3af}
    }
  </style>
  <defs>
    <marker id="cf-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="410"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="408.5" rx="10"/>
  <text class="label ink h" x="24" y="30">Config layers by precedence; secrets stay out of code and git</text>

  <!-- LAYERS -->
  <text class="label muted ph" x="24" y="56">Config precedence &#8212; later layers win</text>
  <rect class="l1" x="24" y="64" width="330" height="30" rx="5"/><text class="label ink s" x="36" y="83" font-weight="700">1 &#183; code defaults</text><text class="label muted s" x="200" y="83">lowest &#183; always present</text>
  <rect class="l2" x="48" y="98" width="330" height="30" rx="5"/><text class="label ink s" x="60" y="117" font-weight="700">2 &#183; config file</text><text class="label mono muted" x="200" y="117">config.yaml / settings.toml</text>
  <rect class="l3" x="72" y="132" width="330" height="30" rx="5"/><text class="label ink s" x="84" y="151" font-weight="700">3 &#183; environment variables</text><text class="label mono muted" x="256" y="151">DB_URL=&#8230;</text>
  <rect class="l4" x="96" y="166" width="330" height="30" rx="5"/><text class="label ink s" x="108" y="185" font-weight="700">4 &#183; CLI flags / runtime</text><text class="label muted s" x="270" y="185">highest &#183; overrides all</text>
  <path class="edge" d="M440,180 L440,74" marker-end="url(#cf-a)"/>
  <text class="label s muted" x="448" y="120">higher layer</text>
  <text class="label s muted" x="448" y="136">overrides lower</text>
  <text class="label green s" x="448" y="166" font-weight="700">effective value =</text>
  <text class="label muted s" x="448" y="182">highest layer that</text>
  <text class="label muted s" x="448" y="196">sets the key</text>

  <text class="label muted s" x="24" y="216">Same code, different config per environment (dev / staging / prod) &#8212; nothing hardcoded, so one build runs anywhere.</text>

  <!-- SECRETS -->
  <line class="frame" x1="24" y1="232" x2="696" y2="232" stroke="#cbd5e1"/>
  <text class="label red ph" x="24" y="256">Secrets never go in code or git</text>
  <rect class="secret" x="24" y="266" width="330" height="66" rx="7"/>
  <text class="label red s" x="36" y="284" font-weight="700">&#10007; never</text>
  <text class="label mono ink" x="36" y="302" font-size="9">API_KEY = "sk-live-9f2a&#8230;"  # in source</text>
  <text class="label muted s" x="36" y="320">committed once = leaked forever in git history</text>
  <rect class="okbox" x="366" y="266" width="330" height="66" rx="7"/>
  <text class="label green s" x="378" y="284" font-weight="700">&#10003; from the environment / a manager</text>
  <text class="label mono ink" x="378" y="302" font-size="9">key = os.environ["API_KEY"]</text>
  <text class="label muted s" x="378" y="320">.env is git-ignored; commit .env.example (keys, no values)</text>

  <line class="frame" x1="24" y1="348" x2="696" y2="348" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="370">Configuration describes <tspan class="ink" font-weight="700">how</tspan> the app runs and belongs to the environment, not the code &#8212; layer it so a prod</text>
  <text class="label muted s" x="24" y="388">override never touches the source. And isolate each project's packages in a <tspan class="ink" font-weight="700">venv</tspan> so dependency versions can't clash.</text>
</svg>
