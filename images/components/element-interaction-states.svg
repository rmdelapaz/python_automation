<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="ei-title ei-desc" preserveAspectRatio="xMidYMid meet">
  <title id="ei-title">Locating an element is not enough: it must be present, visible and enabled to act on</title>
  <desc id="ei-desc">A decision ladder for interacting with a web element. After find_element locates it, three gates are checked in order. Is it in the DOM? If not, NoSuchElementException. Is it displayed, meaning visible with a non-zero size? If not, the click is not interactable. Is it enabled, meaning not disabled? If not, ElementNotInteractableException. Only when all three are true do click and send_keys succeed. A side panel lists the state checks: is_displayed for visibility, is_enabled for not disabled, and is_selected for checkbox or radio state, and advises pairing them with an explicit wait for element_to_be_clickable.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10.5px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .flow{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.4}
    .dia{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.6}
    .bad{fill:#fef2f2;stroke:#ef4444;stroke-width:1.3}
    .good{fill:#ecfdf5;stroke:#10b981;stroke-width:1.6}
    .edge{stroke:#64748b;stroke-width:1.7;fill:none}
    .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .flow{fill:#1e293b;stroke:#569cd6}.dia{fill:#3a2e0a;stroke:#fbbf24}
      .bad{fill:#3a1a1a;stroke:#f87171}.good{fill:#064e3b;stroke:#34d399}
      .edge{stroke:#9ca3af}.panel{fill:#26262a;stroke:#3f3f46}
    }
  </style>
  <defs>
    <marker id="ei-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="420"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="418.5" rx="10"/>
  <text class="label ink h" x="24" y="30">Found an element? It still must be visible and enabled before you can act</text>

  <!-- LADDER -->
  <rect class="flow" x="120" y="48" width="230" height="30" rx="6"/><text class="label mono ink" x="134" y="67">find_element(By.CSS, "&#8230;")</text>
  <path class="edge" d="M235,78 L235,90" marker-end="url(#ei-a)"/>

  <!-- gate 1 -->
  <polygon class="dia" points="235,90 330,116 235,142 140,116"/>
  <text class="label t ink" x="235" y="120" text-anchor="middle">In the DOM?</text>
  <path class="edge" d="M330,116 L400,116" marker-end="url(#ei-a)"/><text class="label s red" x="345" y="110" font-weight="700">No</text>
  <rect class="bad" x="400" y="102" width="196" height="30" rx="5"/><text class="label mono red" x="412" y="121">NoSuchElementException</text>
  <path class="edge" d="M235,142 L235,158" marker-end="url(#ei-a)"/><text class="label s green" x="242" y="156" font-weight="700">Yes</text>

  <!-- gate 2 -->
  <polygon class="dia" points="235,158 335,184 235,210 135,184"/>
  <text class="label t ink" x="235" y="181" text-anchor="middle">Displayed?</text>
  <text class="label s muted" x="235" y="196" text-anchor="middle">(visible, non-zero)</text>
  <path class="edge" d="M335,184 L400,184" marker-end="url(#ei-a)"/><text class="label s red" x="348" y="178" font-weight="700">No</text>
  <rect class="bad" x="400" y="170" width="220" height="30" rx="5"/><text class="label mono red" x="412" y="189">hidden &#8594; not interactable</text>
  <path class="edge" d="M235,210 L235,226" marker-end="url(#ei-a)"/><text class="label s green" x="242" y="224" font-weight="700">Yes</text>

  <!-- gate 3 -->
  <polygon class="dia" points="235,226 330,252 235,278 140,252"/>
  <text class="label t ink" x="235" y="256" text-anchor="middle">Enabled?</text>
  <path class="edge" d="M330,252 L400,252" marker-end="url(#ei-a)"/><text class="label s red" x="345" y="246" font-weight="700">No</text>
  <rect class="bad" x="400" y="238" width="240" height="30" rx="5"/><text class="label mono red" x="412" y="257">disabled &#8594; ElementNotInteractable</text>
  <path class="edge" d="M235,278 L235,294" marker-end="url(#ei-a)"/><text class="label s green" x="242" y="292" font-weight="700">Yes</text>

  <!-- success -->
  <rect class="good" x="120" y="294" width="230" height="32" rx="6"/><text class="label mono green" x="134" y="314" font-weight="700">click() / send_keys() succeed</text>

  <!-- PANEL -->
  <rect class="panel" x="470" y="290" width="226" height="70" rx="8"/>
  <text class="label ink ph" x="484" y="310">Check state before acting</text>
  <text class="label mono ink" x="484" y="328">el.is_displayed()  el.is_enabled()</text>
  <text class="label mono ink" x="484" y="344">el.is_selected()  &#8212; checkbox/radio</text>

  <line class="frame" x1="24" y1="374" x2="696" y2="374" stroke="#cbd5e1"/>
  <text class="label muted s" x="24" y="394">Most "flaky" interaction bugs are really an unchecked state &#8212; the element exists but is still hidden or disabled.</text>
  <text class="label muted s" x="24" y="412">Pair these checks with an explicit wait for element_to_be_clickable so the page has time to reach that state.</text>
</svg>
