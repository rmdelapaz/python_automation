<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="cp-title cp-desc" preserveAspectRatio="xMidYMid meet">
  <title id="cp-title">A command is raw text that must be parsed, validated, authorized, and rate-limited before it runs</title>
  <desc id="cp-desc">A chat command such as slash-ban at spammer 7d for spamming is just untrusted text, and it flows through a pipeline of gates before any action happens. Parse splits it into a command name and arguments. Validate checks the argument types and that required ones are present. Authorize checks the caller has permission. Cooldown enforces a rate limit so the command can't be spammed. Only then does the handler execute and reply. Each of the validate, authorize, and cooldown gates can reject early and send a specific error message back to the user instead of running the command. A security note stresses treating arguments as data, checking permissions before executing, applying cooldowns to prevent abuse, and never using eval on user input.</desc>
  <style>
    .bg{fill:#ffffff}.frame{fill:none;stroke:#cbd5e1;stroke-width:1.5}
    .ink{fill:#1e293b}.muted{fill:#64748b}
    .label{font-family:'Segoe UI',system-ui,sans-serif}
    .h{font-size:15px;font-weight:700}.ph{font-size:12.5px;font-weight:700}
    .t{font-size:12px}.s{font-size:11px}
    .mono{font-family:'Consolas','SF Mono',monospace;font-size:10px}
    .blue{fill:#3b82f6}.green{fill:#10b981}.amber{fill:#f59e0b}.red{fill:#ef4444}
    .inp{fill:#f1f5f9;stroke:#64748b;stroke-width:1.4}
    .parse{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.3}
    .gate{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.3}
    .run{fill:#ecfdf5;stroke:#10b981;stroke-width:1.4}
    .rej{fill:#fef2f2;stroke:#ef4444;stroke-width:1.3}
    .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
    .edge{stroke:#64748b;stroke-width:1.8;fill:none}
    .redge{stroke:#ef4444;stroke-width:1.5;fill:none;stroke-dasharray:4 3}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1e1e1e}.frame{stroke:#3f3f46}.ink{fill:#e5e7eb}.muted{fill:#9ca3af}
      .blue{fill:#569cd6}.green{fill:#34d399}.amber{fill:#fbbf24}.red{fill:#f87171}
      .inp{fill:#26262a;stroke:#9ca3af}.parse{fill:#1e293b;stroke:#569cd6}.gate{fill:#3a2e0a;stroke:#fbbf24}
      .run{fill:#064e3b;stroke:#34d399}.rej{fill:#3a1a1a;stroke:#f87171}.panel{fill:#26262a;stroke:#3f3f46}
      .edge{stroke:#9ca3af}.redge{stroke:#f87171}
    }
  </style>
  <defs>
    <marker id="cp-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
    <marker id="cp-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="410"/>
  <rect class="frame" x="0.75" y="0.75" width="718.5" height="408.5" rx="10"/>
  <text class="label ink h" x="24" y="30">A command is untrusted text &#8212; run it through gates before it does anything</text>

  <!-- raw input -->
  <rect class="inp" x="24" y="54" width="672" height="30" rx="6"/>
  <text class="label mono ink" x="36" y="73" font-size="11">User types:  /ban  @spammer  7d  "posting scam links"</text>

  <!-- pipeline stages -->
  <rect class="parse" x="24" y="104" width="150" height="54" rx="7"/>
  <text class="label blue s" x="34" y="123" font-weight="700">1. Parse</text>
  <text class="label muted s" x="34" y="139" font-size="9.5">split into command</text>
  <text class="label muted s" x="34" y="151" font-size="9.5">+ typed arguments</text>

  <rect class="gate" x="188" y="104" width="150" height="54" rx="7"/>
  <text class="label amber s" x="198" y="123" font-weight="700">2. Validate</text>
  <text class="label muted s" x="198" y="139" font-size="9.5">types &amp; required args</text>
  <text class="label muted s" x="198" y="151" font-size="9.5">present? in range?</text>

  <rect class="gate" x="352" y="104" width="150" height="54" rx="7"/>
  <text class="label amber s" x="362" y="123" font-weight="700">3. Authorize</text>
  <text class="label muted s" x="362" y="139" font-size="9.5">is caller allowed to</text>
  <text class="label muted s" x="362" y="151" font-size="9.5">run this command?</text>

  <rect class="gate" x="516" y="104" width="150" height="54" rx="7"/>
  <text class="label amber s" x="526" y="123" font-weight="700">4. Cooldown</text>
  <text class="label muted s" x="526" y="139" font-size="9.5">rate-limit so it</text>
  <text class="label muted s" x="526" y="151" font-size="9.5">can't be spammed</text>

  <path class="edge" d="M174,131 L186,131" marker-end="url(#cp-a)"/>
  <path class="edge" d="M338,131 L350,131" marker-end="url(#cp-a)"/>
  <path class="edge" d="M502,131 L514,131" marker-end="url(#cp-a)"/>

  <!-- run stage below cooldown -->
  <path class="edge" d="M591,158 L591,182" marker-end="url(#cp-a)"/>
  <rect class="run" x="452" y="184" width="244" height="46" rx="7"/>
  <text class="label green s" x="464" y="203" font-weight="700">5. Handler runs &#8594; reply</text>
  <text class="label muted s" x="464" y="220" font-size="9.5">only now does anything actually happen</text>

  <!-- reject drops -->
  <path class="redge" d="M263,158 L263,190" marker-end="url(#cp-r)"/>
  <path class="redge" d="M427,158 L427,190" marker-end="url(#cp-r)"/>
  <path class="redge" d="M579,158 C560,172 440,180 300,190" marker-end="url(#cp-r)"/>
  <rect class="rej" x="24" y="190" width="392" height="40" rx="7"/>
  <text class="label red s" x="36" y="208" font-weight="700">Any gate can reject early</text>
  <text class="label muted s" x="36" y="224" font-size="9.5">&#8594; send a specific error to the user; the command never executes</text>

  <line class="frame" x1="24" y1="252" x2="696" y2="252" stroke="#cbd5e1"/>
  <rect class="panel" x="24" y="264" width="672" height="72" rx="7"/>
  <text class="label ink ph" x="36" y="284">The pipeline is your security boundary</text>
  <text class="label muted s" x="36" y="303" font-size="10.5">&#8226; Treat every argument as <tspan class="ink" font-weight="700">data, never code</tspan> &#8212; parse and type-check it; <tspan class="red" font-weight="700">never</tspan> <tspan class="mono ink">eval()</tspan> user input.</text>
  <text class="label muted s" x="36" y="320" font-size="10.5">&#8226; Check <tspan class="ink" font-weight="700">permission before executing</tspan>, not after &#8212; a rejected command must have zero side effects.</text>
  <text class="label muted s" x="36" y="336" font-size="10.5">&#8226; <tspan class="ink" font-weight="700">Cooldowns</tspan> stop abuse and runaway loops; a shared help/error format keeps the whole command surface consistent.</text>
</svg>
